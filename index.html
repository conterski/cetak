<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Cetak Draft Pesanan</title>
<!-- tema dipasang SEBELUM halaman digambar, supaya tidak berkedip putih dulu
     saat tema gelap dipakai. Pilihan tersimpan di cdp_theme; kalau belum
     pernah dipilih, ikut pengaturan sistem. -->
<script>
try{
  var t = localStorage.cdp_theme;
  if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.dataset.theme = t;
}catch(e){ document.documentElement.dataset.theme = "light"; }
</script>
<style>
  /* ================= warna =================
     Dua tema, dipilih lewat data-theme di <html> (lihat tombol ☾/☀ di kanan
     atas). Semua warna lewat variabel ini - jangan tulis kode warna langsung,
     nanti tema gelapnya bolong.
     --key* khusus tombol numpad: sengaja dibuat jelas beda dari --bg (latar
     panel numpad) supaya tiap tombol kelihatan timbul, tidak menyatu. */
  :root, :root[data-theme="light"]{
    --bg:#e2e8f2; --card:#fff; --border:#c3ccdb; --accent:#2159d8;
    --accent-dark:#1a49b4; --text:#131b26; --muted:#5a6675;
    --ok:#177245; --err:#b3261e; --seg:#dbe2ec; --on:#cfe0ff; --input:#f3f6fb;
    --key:#fff; --key-border:#b3c0d4; --key-press:#d6e2f6;
    --key-acc:#cfe0ff; --key-dan:#fbdcd9; --seg-act:#fff;
    --paper:#fff; --paper-ink:#131b26;
    --grip:#9fadc0; --shadow:rgba(19,27,38,.16); --shadow-soft:rgba(19,27,38,.10);
    --scrim:rgba(19,27,38,.42);
  }
  :root[data-theme="dark"]{
    --bg:#11161d; --card:#1b222c; --border:#2f3947; --accent:#78a6ff;
    --accent-dark:#9dbcff; --text:#e7edf6; --muted:#9aa7b8;
    --ok:#5fcf94; --err:#ff8a80; --seg:#252f3b; --on:#22375c; --input:#161d26;
    --key:#2a3543; --key-border:#3a4757; --key-press:#3a4757;
    --key-acc:#22375c; --key-dan:#48262a; --seg-act:#3b4859;
    --paper:#e8ecf3; --paper-ink:#131b26;
    --grip:#4a586a; --shadow:rgba(0,0,0,.45); --shadow-soft:rgba(0,0,0,.28);
    --scrim:rgba(0,0,0,.58);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{margin:0; background:var(--bg); color:var(--text);
       font-family:-apple-system,"Segoe UI",sans-serif; padding-bottom:90px}
  .top{display:flex; align-items:center; gap:8px; padding:12px 14px 6px}
  .top h1{font-size:17px; margin:0; flex:1}
  .btn{border:0; border-radius:10px; cursor:pointer; font-family:inherit}
  #btnBT{background:var(--seg); color:var(--muted); padding:9px 12px; font-size:13px; font-weight:600}
  #btnBT.on{background:var(--on); color:var(--accent)}
  #btnTheme{background:var(--seg); color:var(--muted); font-size:15px; line-height:1;
            padding:8px 11px}
  /* pilihan printer (hanya tampil bila jembatan cetak PC terdeteksi) */
  #selPrinter{display:none; background:var(--seg); color:var(--text); border:0;
              border-radius:10px; padding:9px 10px; font-size:13px; font-family:inherit;
              max-width:48vw}
  .rowbar{display:flex; gap:6px; padding:6px 14px; flex-wrap:wrap; align-items:center}
  .seg{display:flex; background:var(--seg); border-radius:10px; padding:3px}
  .seg .btn{background:transparent; color:var(--muted); padding:8px 14px; font-size:13px}
  .seg .btn.act{background:var(--seg-act); color:var(--accent); font-weight:700}
  .tog{background:var(--seg); color:var(--muted); padding:8px 12px; font-size:13px}
  .tog.act{background:var(--on); color:var(--accent); font-weight:700}
  .card{background:var(--card); border:1px solid var(--border); border-radius:14px;
        margin:6px 14px; overflow:hidden}
  .card .cap{font-size:10px; font-weight:700; color:var(--muted); padding:10px 14px 2px;
             letter-spacing:.4px}
  textarea{width:100%; border:0; outline:none; font:inherit; font-size:16px;
           padding:8px 14px 12px; min-height:170px; resize:vertical; background:transparent}
  /* kalkulator */
  /* satu baris: navigasi pita di kiri, Total di kanan. Semua dijaga agar
     TIDAK melipat ke baris kedua (nowrap) supaya pratinjau kebagian ruang. */
  #calcNav{display:flex; align-items:center; gap:5px; padding:6px 14px 2px;
           font-size:11px; color:var(--muted); white-space:nowrap}
  #calcNav .btn{background:transparent; color:var(--muted); font-size:13px;
                padding:2px 5px; line-height:1}
  /* kalau ruang benar-benar mepet (kolom numpad disempitkan + total sangat
     besar), label pita yang mengalah lebih dulu — Total harus tetap terbaca */
  #tapeLbl{flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis}
  #calcNav #btnNew{font-size:11px; padding:4px 8px; border-radius:8px;
                   font-weight:700; line-height:1.1;
                   background:var(--on); color:var(--accent)}
  /* aksi merusak: beri warna peringatan di dalam modal */
  #btnHist{color:var(--err); background:var(--key-dan)}
  /* kolom numpad bisa sesempit 280px, jadi Total dijaga ringkas & tak melipat.
     Urutan mengalah bila ruang benar-benar habis: label pita dulu, baru ekor
     angka total — barisnya sendiri TIDAK pernah melebar keluar kartu. */
  #calcTotal{margin-left:auto; padding-left:4px; color:var(--accent);
             font-weight:700; font-size:13px;
             flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis}
  .inrow{display:flex; gap:8px; padding:6px 14px}
  .inrow input{border:1px solid var(--border); border-radius:10px; background:var(--input);
               font-family:ui-monospace,Menlo,monospace; outline:none; padding:10px}
  #inDate{width:88px; font-size:15px; text-align:center; color:var(--text)}
  /* tanggal warisan baris sebelumnya: redup dulu, jadi normal setelah Enter */
  #inDate.carried{color:var(--muted)}
  #inAmt{flex:1; font-size:22px; text-align:right; min-width:0}
  #editBar{display:none; margin:0 14px; padding:8px 12px; background:var(--on); color:var(--accent);
           border-radius:10px; font-size:13px; font-weight:600; align-items:center; gap:8px}
  #editBar .btn{padding:6px 10px; font-size:12px}
  #btnDelRow{background:var(--key-dan); color:var(--err)}
  #btnCancelEdit{background:var(--card); color:var(--muted)}
  #pad{display:grid; grid-template-columns:repeat(4,1fr); gap:6px; padding:8px 14px 14px}
  /* tombol dibuat "timbul": permukaan --key + garis tepi + bayangan tipis,
     jelas berbeda dari latar panel (--bg) */
  #pad .btn{padding:14px 0; font-size:18px; font-weight:600;
            background:var(--key); color:var(--text);
            border:1px solid var(--key-border);
            box-shadow:0 1px 2px var(--shadow-soft)}
  /* tombol aksi & bahaya tetap memakai garis tepi yang sama, supaya
     batasnya sejelas tombol angka */
  #pad .btn.acc{background:var(--key-acc); color:var(--accent)}
  #pad .btn.dan{background:var(--key-dan); color:var(--err)}
  #pad .btn:active{background:var(--key-press); box-shadow:none; transform:translateY(1px)}
  /* ====== pratinjau: digambar sebagai KERTAS ======
     Lebarnya dikunci tepat selebar hasil cetak (31 karakter + padding), latar
     putih & bergaris tepi, lalu ditaruh di TENGAH panel lewat margin auto.
     Satuan ch = lebar satu karakter font monospace, jadi 31ch persis sama
     dengan lebar kertas 58mm yang dipakai printer. */
  #preview{--kertas:12px;                       /* padding kiri-kanan kertas */
           font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px;
           line-height:1.5; overflow-x:auto; min-height:60px;
           width:calc(31ch + 2 * var(--kertas) + 2px);   /* +2px = garis tepi */
           max-width:100%; margin:8px auto; padding:10px var(--kertas);
           background:var(--paper); color:var(--paper-ink);
           border:1px solid var(--border); border-radius:3px;
           box-shadow:0 1px 3px var(--shadow), 0 6px 16px var(--shadow-soft)}
  /* kertas putih perlu latar yang lebih gelap sedikit supaya tepinya terbaca */
  #previewCard{background:var(--bg)}
  #preview .row{display:inline}
  #preview .row.sel{background:var(--on); color:var(--accent); border-radius:4px}
  /* mode kalkulator: pita jadi jendela tinggi tetap di atas numpad */
  #previewCard.calc{border:0; margin:0; background:transparent}
  #previewCard.calc .cap{display:none}
  /* tinggi diatur JS (layoutCalc); min-height:0 supaya tak menabrak numpad */
  #previewCard.calc #preview{overflow-y:auto; margin:6px auto 2px; min-height:0}
  /* numpad menempel di bawah (di atas bilah CETAK); posisi diatur JS */
  #calcKeys{background:var(--bg)}
  body.calc #calcKeys{border-top:1px solid var(--border);
    padding:0 0 2px; box-shadow:0 -6px 14px var(--shadow-soft);
    display:flex; flex-direction:column}
  /* numpad menyusut mengikuti tinggi yang diseret pengguna */
  body.calc #pad{flex:1 1 auto; min-height:0; grid-auto-rows:1fr; padding:6px 14px 8px}
  body.calc #pad .btn{padding:0; min-height:0}
  /* pegangan seret (hanya mode kalkulator di layar sempit) */
  #keysGrip{display:none}
  body.calc #keysGrip{display:block; position:relative; height:20px; flex:0 0 20px;
    touch-action:none; cursor:ns-resize}
  body.calc #keysGrip::before{content:""; position:absolute; left:50%; top:7px;
    transform:translateX(-50%); width:44px; height:5px; border-radius:3px; background:var(--grip)}
  body.calc #keysGrip:active::before{background:var(--accent)}
  /* pemisah kolom (layar lebar / tablet mendatar): geser untuk mengatur lebar
     numpad — pratinjau otomatis mengisi sisa ruang. Hanya mode kalkulator. */
  #colGrip{display:none}
  .foot{position:fixed; left:0; right:0; bottom:0; background:var(--bg);
        border-top:1px solid var(--border); display:flex; gap:8px; align-items:center;
        padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
  #btnPrint{background:var(--accent); color:var(--card); font-size:16px; font-weight:700; padding:14px 26px}
  #btnPrint:disabled{opacity:.5}
  #btnClear{background:var(--seg); color:var(--text); font-size:14px; padding:14px 16px}
  /* status melar mengisi ruang kiri (mendorong tombol ke kanan), teksnya
     sendiri rata kiri di tepi halaman */
  #stat{flex:1; font-size:12px; color:var(--muted); text-align:left}
  #stat.ok{color:var(--ok)} #stat.err{color:var(--err)}
  /* ====== layar sempit (HP): kartu menumpuk (default) ====== */
  /* caption kalkulator: judul + tombol toggle Tanggal (tampil di semua ukuran) */
  .calcCap{display:flex; align-items:center; gap:10px}
  #togDate{padding:5px 10px; font-size:11px}
  /* tombol OCR di pojok kanan caption panel teks */
  #btnOcr{margin-left:auto; padding:5px 10px; font-size:11px}
  /* ====== pengaturan tampilan (modal di balik tombol gerigi) ====== */
  #btnGear{font-size:16px; line-height:1; padding:8px 12px}
  #btnCalcGear{margin-left:auto; font-size:14px; line-height:1; padding:5px 9px}
  .modalBack{position:fixed; inset:0; z-index:50; padding:16px;
             background:var(--scrim);
             display:flex; align-items:center; justify-content:center}
  .modalBack[hidden]{display:none}
  .modalPanel{margin:0; width:min(340px,100%); max-height:80vh; overflow:auto;
              box-shadow:0 14px 44px var(--shadow)}
  .modalList{display:flex; flex-direction:column; gap:8px; padding:8px 14px 4px}
  .modalList .btn{width:100%; text-align:left; padding:12px 14px; font-size:14px}
  .modalClose{display:block; width:calc(100% - 28px); margin:8px 14px 14px;
              background:var(--seg); color:var(--text); padding:11px 14px; font-size:14px}
  /* ====== layar lebar (desktop): input kiri, pratinjau kanan ====== */
  @media (min-width:768px){
    body{padding-bottom:0}
    /* baris mode + baris toggle jadi satu baris di tata letak kiri-kanan */
    .rowbar{display:inline-flex; vertical-align:middle}
    .rowbar + .rowbar{padding-left:2px}
    #stage{display:flex; gap:14px; align-items:stretch; margin:6px 14px}
    #stage>.card{margin:0}
    #panelText{flex:1.3 1 0; display:flex; flex-direction:column}
    #panelText textarea{flex:1 1 auto; min-height:0}
    #panelCalc{flex:0 0 360px; display:flex; flex-direction:column}
    #panelCalc #calcKeys{flex:1 1 auto; display:flex; flex-direction:column}
    #panelCalc #pad{flex:1 1 auto; grid-auto-rows:1fr}
    #previewCard{flex:1 1 0; display:flex; flex-direction:column; min-height:0}
    #previewCard .cap{flex:0 0 auto}
    #previewCard #preview{flex:1 1 0; min-height:0; overflow:auto}
    #btlog{display:none}
    /* di desktop numpad TIDAK menempel ke bawah layar */
    body.calc #calcKeys{border:0; box-shadow:none}
    /* tukar sisi: panel isian ke kanan, pratinjau ke kiri */
    #stage.rev{flex-direction:row-reverse}
    /* pegangan pemisah kolom (dinyalakan JS lewat kelas .on) */
    #colGrip.on{display:block; position:relative; flex:0 0 14px; align-self:stretch;
      touch-action:none; cursor:col-resize}
    #colGrip.on::before{content:""; position:absolute; top:50%; left:50%;
      transform:translate(-50%,-50%); width:5px; height:44px; border-radius:3px;
      background:var(--grip)}
    #colGrip.on:active::before{background:var(--accent)}
  }
</style>
</head>
<body>

<div class="top">
  <h1>Cetak Draft Pesanan</h1>
  <select id="selPrinter" title="Pilih printer"></select>
  <button class="btn" id="btnTheme" aria-label="Ganti tema terang/gelap"></button>
  <button class="btn" id="btnBT">&#9679; Hubungkan</button>
</div>

<div class="rowbar">
  <div class="seg" id="segMode">
    <button class="btn" data-m="table">Tabel</button>
    <button class="btn" data-m="plain">Teks polos</button>
    <button class="btn" data-m="calc">Kalkulator</button>
  </div>
  <button class="btn tog" id="btnGear" title="Pengaturan tampilan"
          aria-haspopup="dialog" aria-expanded="false">&#9881;</button>
</div>

<!-- pengaturan tampilan: tombol-tombol yang dulu berjajar di bawah baris mode.
     Elemennya SAMA (id tidak berubah), hanya pindah tempat, jadi semua logika
     yang memakainya (refreshToggles dll) tetap berjalan. -->
<div id="setBack" class="modalBack" hidden>
  <div class="card modalPanel" id="setPanel" role="dialog" aria-modal="true"
       aria-label="Pengaturan tampilan">
    <div class="cap">PENGATURAN TAMPILAN</div>
    <div class="modalList">
      <button class="btn tog" id="togNum">Nomor urut</button>
      <button class="btn tog" id="togHead">Tanggal &amp; garis</button>
      <button class="btn tog" id="togAuto" style="display:none">Auto-cetak</button>
      <button class="btn tog" id="togSwap" style="display:none"
              title="Tukar posisi panel isian &amp; pratinjau">&#8646; Tukar sisi</button>
    </div>
    <button class="btn modalClose" id="btnSetClose">Tutup</button>
  </div>
</div>

<!-- pengaturan khusus kalkulator, dibuka dari gerigi di baris KALKULATOR PITA -->
<div id="calcSetBack" class="modalBack" hidden>
  <div class="card modalPanel" id="calcSetPanel" role="dialog" aria-modal="true"
       aria-label="Pengaturan kalkulator">
    <div class="cap">PENGATURAN KALKULATOR</div>
    <div class="modalList">
      <button class="btn tog" id="togDate"
              title="Kolom tanggal d/m di tiap baris">Tanggal per baris</button>
      <button class="btn tog" id="togRibu"
              title="Angka yang diketik dikalikan 1000">&times;1000</button>
      <button class="btn tog" id="btnZeroC"
              title="Tampilkan baris 0 C di awal tiap pita">Baris 0 C</button>
      <button class="btn tog" id="togHaptic"
              title="Getar tiap tombol numpad ditekan; bila perangkat tak bisa getar, diganti bunyi klik">Getar / bunyi tombol</button>
      <!-- jarang dipakai & merusak (ada konfirmasi), jadi disimpan di sini
           supaya baris navigasi cukup untuk Pita/Baru/Total tanpa melipat -->
      <button class="btn" id="btnHist"
              title="Hapus SEMUA riwayat pita">Hapus riwayat pita</button>
    </div>
    <button class="btn modalClose" id="btnCalcSetClose">Tutup</button>
  </div>
</div>

<div id="stage">

<div class="card" id="panelText">
  <div class="cap calcCap">
    <span id="capText">KETIK PESANAN — SATU BARANG PER BARIS</span>
    <button class="btn tog" id="btnOcr" title="Baca teks dari foto/gambar (OCR)">&#128247; Foto</button>
    <input type="file" id="ocrFile" accept="image/*" hidden>
  </div>
  <textarea id="txt" placeholder="Besi beton 8 mm 10 btg&#10;Semen 5 sak&#10;Gypsum 6 lbr"></textarea>
</div>

<div class="card" id="panelCalc" style="display:none">
  <div class="cap calcCap">
    <span>KALKULATOR PITA</span>
    <button class="btn tog" id="btnCalcGear" title="Pengaturan kalkulator"
            aria-haspopup="dialog" aria-expanded="false">&#9881;</button>
  </div>
  <div id="calcNav">
    <button class="btn" id="btnPrev">&#9664;</button>
    <span id="tapeLbl">Pita 1/1</span>
    <button class="btn" id="btnNext">&#9654;</button>
    <button class="btn" id="btnNew" title="Buat pita baru">Baru</button>
    <div id="calcTotal">Total: 0 (0 nota)</div>
  </div>
  <div id="calcKeys">
  <div id="keysGrip" title="Geser untuk mengatur tinggi numpad (ketuk dua kali: otomatis)"></div>
  <div class="inrow" id="calcInRow">
    <input id="inDate" placeholder="h/b" maxlength="5" inputmode="numeric">
    <input id="inAmt" placeholder="0" inputmode="decimal">
  </div>
  <div id="editBar"><span id="editLbl"></span>
    <button class="btn" id="btnDelRow">Hapus</button>
    <button class="btn" id="btnCancelEdit">Batal</button>
  </div>
  <div id="pad">
    <button class="btn dan" data-k="C">C</button>
    <button class="btn" data-k="BS">&#9003;</button>
    <button class="btn" data-k="SUB">SUB</button>
    <button class="btn acc" data-k="TOT">TOTAL</button>
    <button class="btn" data-k="7">7</button><button class="btn" data-k="8">8</button>
    <button class="btn" data-k="9">9</button><button class="btn acc" data-k="+">+</button>
    <button class="btn" data-k="4">4</button><button class="btn" data-k="5">5</button>
    <button class="btn" data-k="6">6</button><button class="btn" data-k="-">&#8722;</button>
    <button class="btn" data-k="1">1</button><button class="btn" data-k="2">2</button>
    <button class="btn" data-k="3">3</button><button class="btn" data-k="00">00</button>
    <button class="btn" data-k="0">0</button><button class="btn" data-k="000">000</button>
    <button class="btn" data-k=".">.</button><button class="btn dan" data-k="CA">CA</button>
  </div>
  </div>
</div>

<div id="colGrip" title="Geser untuk mengatur lebar numpad (ketuk dua kali: otomatis)"></div>

<div class="card" id="previewCard">
  <div class="cap">PRATINJAU</div>
  <pre id="preview"></pre>
</div>

</div><!-- /stage -->

<details class="card" id="btlog" style="padding:0 0 8px">
  <summary style="font-size:11px; font-weight:700; color:var(--muted); padding:10px 14px; cursor:pointer">LOG BLUETOOTH (untuk diagnosa)</summary>
  <pre id="btlogtxt" style="font-family:ui-monospace,Menlo,monospace; font-size:10px; margin:0; padding:0 14px; white-space:pre-wrap; word-break:break-all; color:var(--muted)"></pre>
</details>

<!-- urutan sengaja: status dulu (melar mengisi ruang) supaya tombol terdorong
     ke kanan — CETAK paling kanan, Bersihkan di sebelah kirinya. Urutan DOM
     dibuat sama dengan urutan tampilan agar urutan Tab ikut benar. -->
<div class="foot">
  <div id="stat">Siap.</div>
  <button class="btn" id="btnClear">Bersihkan</button>
  <button class="btn" id="btnPrint">CETAK</button>
</div>

<!-- SEMUA logika parsing/format ada di core.js (dibagi PC & iPhone) -->
<script src="core.js?v=21"></script>
<script>
"use strict";
/* ================= status & state ================= */
const $ = id => document.getElementById(id);
const statEl = $("stat");
function setStat(msg, cls){ statEl.textContent = msg; statEl.className = cls || ""; }

let mode = localStorage.cdp_mode || "table";
if (mode === "excel") mode = "table";   // mode Excel sudah dihapus
delete localStorage.cdp_grid;
let numbered = localStorage.cdp_num !== "0";
let headers = localStorage.cdp_head !== "0";
let autoprint = localStorage.cdp_auto === "1";
let usedate = localStorage.cdp_usedate === "1";   // kolom tanggal per-baris (default mati)
let zeroc = localStorage.cdp_zeroc !== "0";       // baris "0 C" di awal tiap pita (default nyala)
let ribu = localStorage.cdp_ribu === "1";         // ×1000: nominal diketik dalam ribuan (default mati)
let haptic = localStorage.cdp_haptic !== "0";     // getar/bunyi tiap tombol numpad (default nyala)
let tapes = [[["c"]]], active = 0, sel = null;
try {
  const t = JSON.parse(localStorage.cdp_tapes || "null");
  if (Array.isArray(t) && t.length) tapes = t.slice(-6);
} catch(e){}
active = tapes.length - 1;
$("txt").value = localStorage.cdp_text || "";

const curTape = () => tapes[active];
function saveAll(){
  localStorage.cdp_mode = mode; localStorage.cdp_num = numbered ? "1" : "0";
  localStorage.cdp_head = headers ? "1" : "0";
  localStorage.cdp_usedate = usedate ? "1" : "0";
  localStorage.cdp_zeroc = zeroc ? "1" : "0";
  localStorage.cdp_ribu = ribu ? "1" : "0";

/* desktop: tinggi panggung mengisi ruang sampai bilah CETAK, agar
   panel kiri & pratinjau kanan sama tinggi & sejajar */
function layoutDesktop(){
  const stage = $("stage");
  if (!isDesktop()){ stage.style.height = ""; return; }
  const footH = document.querySelector(".foot").getBoundingClientRect().height;
  const top = stage.getBoundingClientRect().top;

/* HP: numpad menempel di bawah, tingginya bisa diseret; sisanya untuk pita.
   keysH = 0 berarti otomatis (proporsional terhadap tinggi layar). */
const MIN_KEYS = 170, MIN_PREVIEW = 120, FLOOR_PREVIEW = 60, GAP = 8, KEYS_RATIO = 0.55;
let keysH = parseInt(localStorage.cdp_keysh || "0", 10) || 0;

function layoutCalc(){
  const keys = $("calcKeys"), pv = $("preview");
  if (!(mode === "calc" && !isDesktop())){
    keys.style.position = keys.style.left = keys.style.right =
      keys.style.bottom = keys.style.zIndex = keys.style.height = "";
    pv.style.height = "";
    return;
  }
  const footH = document.querySelector(".foot").getBoundingClientRect().height;
  keys.style.position = "fixed";
  keys.style.left = "0"; keys.style.right = "0";
  keys.style.bottom = footH + "px";
  keys.style.zIndex = "10";

  // ruang yang tersedia dari atas pita sampai bilah CETAK
  keys.style.height = "";                       // ukur tinggi alami numpad dulu
  const natural = keys.offsetHeight;
  const top = pv.getBoundingClientRect().top;
  const avail = window.innerHeight - footH - top - GAP;

  // batas: numpad cukup besar untuk dipakai, pita selalu kebagian sisa ruang
  const minKeys = Math.min(MIN_KEYS, Math.max(110, avail - FLOOR_PREVIEW));
  const maxKeys = Math.max(minKeys, avail - FLOOR_PREVIEW);
  // otomatis: tak lebih dari KEYS_RATIO ruang, tak lebih tinggi dari alaminya,
  // dan sebisanya sisakan MIN_PREVIEW untuk pita
  const auto = Math.min(natural, Math.round(avail * KEYS_RATIO), Math.max(minKeys, avail - MIN_PREVIEW));
  let h = Math.max(minKeys, Math.min(keysH || auto, maxKeys));

  keys.style.height = h + "px";
  pv.style.height = Math.max(FLOOR_PREVIEW, Math.floor(avail - h)) + "px";
  return h;
}
/* pegangan seret: tarik ke atas = numpad lebih tinggi, ke bawah = pita lebih lega */
function initGrip(){
  const grip = $("keysGrip");
  let startY = 0, startH = 0, dragging = false;
  grip.addEventListener("pointerdown", e => {
    if (!(mode === "calc" && !isDesktop())) return;
    dragging = true; startY = e.clientY; startH = $("calcKeys").offsetHeight;
    try { grip.setPointerCapture(e.pointerId); } catch(_e){}
    e.preventDefault();
  });
  grip.addEventListener("pointermove", e => {
    if (!dragging) return;
    keysH = startH + (startY - e.clientY);   // seret ke atas -> makin tinggi
    layoutCalc();
    e.preventDefault();
  });
  const end = e => {
    if (!dragging) return;
    dragging = false;
    try { grip.releasePointerCapture(e.pointerId); } catch(_e){}
    keysH = $("calcKeys").offsetHeight;      // simpan nilai yang sudah dibatasi
    localStorage.cdp_keysh = String(keysH);
  };
  grip.addEventListener("pointerup", end);
  grip.addEventListener("pointercancel", end);
  // ketuk dua kali -> kembali ke tinggi otomatis
  grip.addEventListener("dblclick", () => {
    keysH = 0; delete localStorage.cdp_keysh; layoutCalc();
    setStat("Tinggi numpad otomatis.");
  });
}
/* ====== layar lebar / tablet mendatar: lebar kolom numpad bisa diseret ======

const MIN_CALC_W = 280, MIN_PREV_W = 260, AUTO_CALC_W = 360;
let calcW = parseInt(localStorage.cdp_calcw || "0", 10) || 0;
let swapped = localStorage.cdp_swap === "1";

function layoutStage(){
  const panel = $("panelCalc"), grip = $("colGrip");
  const on = isDesktop() && mode === "calc";
  grip.classList.toggle("on", on);
  if (!on){ panel.style.flex = ""; return; }
  // batas: numpad tetap layak dipakai, pratinjau tetap muat 31 karakter
  const stageW = $("stage").clientWidth;
  const spacer = 14 * 2 + grip.offsetWidth;      // dua jarak antarkolom + pegangan
  const maxW = Math.max(MIN_CALC_W, stageW - spacer - MIN_PREV_W);
  const w = Math.max(MIN_CALC_W, Math.min(calcW || AUTO_CALC_W, maxW));
  panel.style.flex = "0 0 " + w + "px";
  return w;
}
/* pegangan pemisah: seret kiri/kanan. Saat sisi ditukar, arah seret ikut

function initColGrip(){
  const grip = $("colGrip");
  let startX = 0, startW = 0, dragging = false;
  grip.addEventListener("pointerdown", e => {
    if (!(isDesktop() && mode === "calc")) return;
    dragging = true; startX = e.clientX;
    startW = $("panelCalc").getBoundingClientRect().width;
    try { grip.setPointerCapture(e.pointerId); } catch(_e){}
    e.preventDefault();
  });

    if (!dragging) return;
    const dx = e.clientX - startX;
    calcW = Math.round(startW + (swapped ? -dx : dx));
    layoutStage();
    e.preventDefault();
  });
  const end = e => {
    if (!dragging) return;
    dragging = false;
    try { grip.releasePointerCapture(e.pointerId); } catch(_e){}
    calcW = Math.round($("panelCalc").getBoundingClientRect().width);  // simpan hasil yang sudah dibatasi
    localStorage.cdp_calcw = String(calcW);
  };
  grip.addEventListener("pointerup", end);
  grip.addEventListener("pointercancel", end);

    setStat("Lebar numpad otomatis.");

function padDateDigit(d){

  if (dateCarried){ setDateCarried(false); el.dataset.raw = ""; el.value = ""; }
  let raw = el.dataset.raw || "";
  if (raw.length >= 4) return;             // sudah penuh: pakai ⌫ untuk mengubah
  raw += d;

  const [ip, dec] = raw.split(".");

function commit(op){
  let v = parseAmount($("inAmt").value);
  if (v === null){ if ($("inAmt").value.trim()) setStat("Angka tidak valid.","err"); return; }
  if (ribu) v *= 1000;
  // Tanggal aktif -> wajib diisi lengkap (DDMM) sebelum baris bisa disimpan
  let raw = "";
  if (usedate){
    raw = $("inDate").dataset.raw || "";
    if (!dateValid(raw)){
      // sudah 4 angka tapi tidak sah -> kosongkan supaya bisa langsung diketik ulang
      if (raw.length >= 4) setDate("");
      setStat("Tanggal wajib diisi: 4 angka DDMM, mis. 0907 = 9/7.","err");
      focusDate();
      return;
    }
    setDate(raw);   // pastikan tersimpan sebagai "d/m"
  }
  const ev = ["e", v, op, usedate ? $("inDate").value.trim() : ""];
  // dicatat SEBELUM clearSel(), karena clearSel() sendiri memakai lastDate
  lastDate = raw;
  if (sel !== null){ curTape()[sel] = ev; clearSel(); setStat("Baris diperbarui.","ok"); }
  else { curTape().push(ev); setStat("Siap."); }
  // reset baris berikutnya: Nominal dikosongkan, Tanggal dibawa dari baris ini
  $("inAmt").value = ""; carryDate();
  if (usedate) focusDate(); else focusAmt();
  refreshCalcHead(); updatePreview(); saveAll();
}

    else { curTape().push(["e", v, "+", ""]); n++; }
  }
  if (!n){ setStat("Tempelan tidak berisi angka yang bisa dibaca.","err"); return; }
  refreshCalcHead(); updatePreview(); saveAll();
  setStat(`${n} baris ditambahkan dari tempelan.` + (skip ? ` (${skip} baris dilewati)` : ""), "ok");
  focusEntry();
}

async function printBridge(draftText){

                              isTab || mode === "plain", headers);

/* ================= OCR: foto/gambar -> teks ================= */
/* Mesin OCR (Tesseract.js) dimuat dari internet saat PERTAMA dipakai;
   data bahasa (ind+eng, belasan MB) diunduh sekali lalu disimpan browser,
   jadi pemakaian berikutnya cepat. Hasil masuk ke kotak teks — dipakai
   di mode Tabel maupun Teks polos. */
let ocrWorker = null, ocrBusy = false;
function loadScript(src){
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = src;
    s.onload = res;
    s.onerror = () => rej(new Error("tidak bisa memuat mesin OCR - periksa internet"));
    document.head.appendChild(s);
  });
}
async function getOcrWorker(){
  if (ocrWorker) return ocrWorker;
  if (!window.Tesseract){
    setStat("Memuat mesin OCR...");
    await loadScript("https://cdn.jsdelivr.net/npm/tesseract.js@6/dist/tesseract.min.js");
  }
  setStat("Menyiapkan bahasa OCR (pertama kali agak lama)...");
  ocrWorker = await Tesseract.createWorker(["ind","eng"], 1, {
    logger: m => {
      if (m.status === "recognizing text")
        setStat("Membaca foto... " + Math.round(m.progress * 100) + "%");
    }
  });
  return ocrWorker;
}
/* rapikan hasil OCR: satu barang per baris, buang baris sampah tanpa huruf/angka */
function cleanOcrText(text){
  return text.split("\n")
    .map(l => l.replace(/\s+/g," ").trim())
    .filter(l => /[A-Za-z0-9]/.test(l))
    .join("\n");
}
async function runOcr(blob){
  if (ocrBusy || !blob) return;
  ocrBusy = true;
  $("btnOcr").disabled = true;
  try {
    const worker = await getOcrWorker();
    setStat("Membaca foto...");
    const {data} = await worker.recognize(blob);
    const text = cleanOcrText(data.text || "");
    if (!text){ setStat("Tidak ada teks terbaca di foto itu.","err"); return; }
    const el = $("txt");
    el.value = el.value.trim() ? el.value.replace(/\s+$/,"") + "\n" + text : text;
    updatePreview(); saveAll();
    setStat("OCR selesai - " + text.split("\n").length + " baris. Periksa hasilnya.","ok");
  } catch(e){
    ocrWorker = null;   // worker bisa rusak - buat baru pada percobaan berikutnya
    setStat("OCR gagal: " + ((e && e.message) || "periksa koneksi internet"), "err");
  } finally {
    ocrBusy = false;
    $("btnOcr").disabled = false;
  }
}
/* ================= Bluetooth LE (ESC/POS) ================= */
/* Daftar layanan BLE printer thermal yang umum - halaman hanya boleh
   mengakses layanan yang disebut di sini. */
/* Semua UUID ditulis lengkap sebagai string - jembatan Bluetooth Bluefy
   tidak bisa membaca kode angka pendek (0x18F0 dst.). */
const BLE_SERVICES = [
  "000018f0-0000-1000-8000-00805f9b34fb",  // ESC/POS-over-BLE standar (char 2AF1)
  "0000ae30-0000-1000-8000-00805f9b34fb",  // printer saku (char AE01)
  "0000ff00-0000-1000-8000-00805f9b34fb",
  "0000ff10-0000-1000-8000-00805f9b34fb",
  "0000ff12-0000-1000-8000-00805f9b34fb",
  "0000ffd0-0000-1000-8000-00805f9b34fb",
  "0000ffe0-0000-1000-8000-00805f9b34fb",
  "0000ffe5-0000-1000-8000-00805f9b34fb",
  "0000fff0-0000-1000-8000-00805f9b34fb",
  "0000abf0-0000-1000-8000-00805f9b34fb",
  "0000fee7-0000-1000-8000-00805f9b34fb",
  "49535343-fe7d-4ae5-8fa9-9fafd205e455",  // ISSC/Microchip UART (Rongta dkk.)
  "e7810a71-73ae-499d-8c15-faa9aef0c3f2",  // Zjiang/Goojprt dkk.
];
let bleDevice = null, bleChar = null;

function blog(msg){
  const el = $("btlogtxt");
  el.textContent += msg + "\n";
}
function propsOf(c){
  const p = c.properties || {};
  const list = ["write","writeWithoutResponse","notify","read","indicate"]
    .filter(k => p[k]).join(",");
  return list || "?";
}
/* karakteristik "tulis" yang dikenal pada printer thermal (dicocokkan
   berdasarkan UUID kalau Bluefy tidak menyediakan .properties) */
const WRITE_CHARS = ["2af1","ffe1","ff02","ff03","ae01","abf1",
  "49535343-8841-43f4-a8d4-ecbe34729bb3",
  "bef8d6c9-9c21-4c9e-b632-bd58c1009f9f"];
function isKnownWrite(uuid){
  const u = uuid.toLowerCase();
  return WRITE_CHARS.some(w => u === w || u.startsWith("0000" + w + "-") || u.includes(w));
}
async function connectBT(){
  if (!navigator.bluetooth){
    setStat("Bluetooth tidak tersedia. Buka halaman ini di aplikasi Bluefy.","err");
    return false;
  }
  bleChar = null;
  try {
    if (!bleDevice){
      blog("--- " + new Date().toLocaleTimeString() + " ---");
      blog("Membuka daftar perangkat...");
      bleDevice = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true, optionalServices: BLE_SERVICES });
      blog("Dipilih: " + (bleDevice.name || "(tanpa nama)"));
      bleDevice.addEventListener("gattserverdisconnected", () => {
        bleChar = null; $("btnBT").classList.remove("on");
        $("btnBT").innerHTML = "&#9679; Hubungkan";
        blog("Perangkat terputus.");
      });
    }
    let server = null, lastErr = null;
    if (bleDevice.gatt.connected){            // sudah tersambung -> pakai ulang
      server = bleDevice.gatt;
      blog("GATT sudah tersambung, dipakai ulang.");
    }
    for (let i = 1; i <= 3 && !server; i++){
      try {
        blog("Menghubungkan GATT (percobaan " + i + ")...");
        server = await bleDevice.gatt.connect();
      } catch(e){
        lastErr = e;
        blog("  gagal: " + e.name + " - " + e.message);
        // Bluefy kadang melempar "already registered/connected" padahal
        // sambungan sudah aktif -> pakai saja sambungan yang ada.
        if (/already|registered|connected/i.test((e.name || "") + " " + (e.message || ""))){
          blog("  (dianggap sudah tersambung)");
          server = bleDevice.gatt;
          break;
        }
        await sleep(900);
      }
    }
    if (!server) throw lastErr;
    blog("GATT terhubung. Mencari layanan...");
    let services = [];
    try { services = await server.getPrimaryServices(); }
    catch(e){ blog("getPrimaryServices: " + e.name + " - " + e.message); }
    blog("Layanan terlihat: " + services.length);
    let byProp = null, byName = null, anyChar = null;
    for (const s of services){
      blog("svc " + s.uuid);
      let chars = [];
      try { chars = await s.getCharacteristics(); }
      catch(e){ blog("  (karakteristik: " + e.message + ")"); continue; }
      for (const c of chars){
        blog("  chr " + c.uuid + " [" + propsOf(c) + "]");
        const p = c.properties || {};
        if ((p.writeWithoutResponse || p.write) && !byProp) byProp = c;
        if (isKnownWrite(c.uuid) && !byName) byName = c;
        if (!anyChar) anyChar = c;
      }
    }
    // pilih: yang jelas bisa tulis > yang UUID-nya dikenal > apa saja
    bleChar = byProp || byName || anyChar;
    if (!bleChar){
      blog("Tidak ditemukan jalur tulis.");
      setStat("Layanan printer tidak dikenali - buka LOG BLUETOOTH di bawah "
              + "dan kirimkan isinya.","err");
      $("btlog").open = true;
      return false;
    }
    blog("Dipakai: chr " + bleChar.uuid);
    $("btnBT").classList.add("on");
    $("btnBT").innerHTML = "&#9679; " + (bleDevice.name || "Terhubung");
    setStat("Printer terhubung.","ok");
    return true;
  } catch(e){
    if (e && e.name === "NotFoundError"){ setStat("Dibatalkan."); return false; }
    blog("ERROR: " + (e ? e.name + " - " + e.message : "tidak diketahui"));
    setStat("Gagal terhubung (" + (e ? e.name : "?") + ") - buka LOG BLUETOOTH "
            + "di bawah dan kirimkan isinya.","err");
    $("btlog").open = true;
    bleDevice = null;  // mulai bersih pada percobaan berikutnya
    return false;
  }
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function writeOne(part){
  // .properties tak bisa dipercaya di Bluefy: coba tanpa-respons dulu,
  // lalu dengan-respons; ingat mana yang berhasil.
  if (bleWrite._m === "wor" || bleWrite._m == null){
    try { await bleChar.writeValueWithoutResponse(part); bleWrite._m = "wor"; return; }
    catch(e){ if (bleWrite._m === "wor") throw e; }
  }
  await bleChar.writeValue(part); bleWrite._m = "wr";
}
async function bleWrite(bytes){
  let chunk = 100;
  for (let attempt = 0; attempt < 2; attempt++){
    try {
      for (let i = 0; i < bytes.length; i += chunk){
        await writeOne(bytes.slice(i, i + chunk));
        await sleep(25);
      }
      blog("Cetak terkirim (" + bytes.length + " byte).");
      return;
    } catch(e){
      blog("tulis gagal (potongan " + chunk + "): " + e.name + " - " + e.message);
      if (attempt === 0){ chunk = 20; bleWrite._m = null; await sleep(300); }
      else throw e;
    }
  }
}

async function doPrint(skipConfirm){

    : $("txt").value.trim() !== "";

    const [res, sum] = resolveTape(curTape());
    summary = `${res.filter(o=>o[0]==="e").length} baris, total ${fmtAmount(sum)}`;
  } else {

  }

  if (bridge){ await printBridge(); return; }    // PC: lewat jembatan cetak lokal
  // bleChar dikosongkan oleh listener "gattserverdisconnected" saat benar-benar

  if (!bleChar){

let audioCtx = null;
function clickSound(){
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!audioCtx) audioCtx = new AC();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
    osc.type = "square";
    osc.frequency.setValueAtTime(1700, t);
    // amplop sangat pendek -> terdengar seperti "tik", bukan nada
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.09, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + 0.035);
  } catch(e){ /* audio diblokir/tak didukung: diamkan saja */ }
}
function canVibrate(){
  // hanya perangkat sentuh yang punya motor getar; di PC navigator.vibrate
  // kadang ada tapi tidak melakukan apa-apa, jadi jangan diandalkan di sana
  return isTouch() && typeof navigator.vibrate === "function";
}
function padFeedback(){
  if (!haptic) return;
  if (canVibrate() && navigator.vibrate(8)) return;
  clickSound();
}
// jangan curi fokus dari kolom isian saat menekan tombol numpad
$("pad").addEventListener("mousedown", e => e.preventDefault());
$("pad").addEventListener("click", e => {
  const b = e.target.closest("[data-k]");
  if (!b) return;
  padFeedback();                                // getar, atau bunyi klik

  const k = b.dataset.k, el = $("inAmt");
  const onDate = usedate && activeField === "date";
  if (k === "C") { if (onDate){ setDate(""); setDateCarried(false); } else el.value = ""; }
  else if (k === "BS") { if (onDate) backspaceDate(); else backspace(); }
  else if (k === "SUB") keySub();
  else if (k === "TOT") keyTot();
  else if (k === "CA") keyCA();
  else if (k === "+") commit("+");
  else if (k === "-") commit("-");
  else if (k === ".") { if (!onDate && !el.value.includes(".")) el.value += "."; }
  else if (onDate) { for (const d of k) padDateDigit(d); }   // "00"/"000" -> per angka
  else { el.value += k; liveComma(); }
});
/* ---- aturan tombol untuk kolom Nominal (dipanggil hanya dari juru-antar) ---- */
function amtKey(e){
  const el = $("inAmt"), k = e.key;
  // Shift+Enter: lompat dari Nominal kembali ke Tanggal
  if (k === "Enter" && e.shiftKey){ if (usedate) focusDate(); e.preventDefault(); return; }
  // panah kiri di ujung kiri Nominal -> pindah ke Tanggal ("di ujung")
  if (k === "ArrowLeft"){
    if (usedate && el.selectionStart === 0 && el.selectionEnd === 0){ focusDate(); e.preventDefault(); }
    return;   // selain di ujung: biarkan caret bergerak normal
  }
  if (k === "ArrowRight") return;  // caret normal
  if (k === "ArrowUp"){ selectPrev(); e.preventDefault(); return; }    // pilih baris sebelumnya
  if (k === "ArrowDown"){ selectNext(); e.preventDefault(); return; }  // pilih baris berikutnya
  if (/^[0-9]$/.test(k)){ el.value += k; liveComma(); e.preventDefault(); }
  else if (k === "."){ if (!el.value.includes(".")) el.value += "."; e.preventDefault(); }
  else if (k === "Enter" || k === "+"){ commit("+"); e.preventDefault(); }  // commit atur fokus
  else if (k === "-"){ commit("-"); e.preventDefault(); }
  else if (k === "Backspace"){ backspace(); e.preventDefault(); }      // mundur ke kiri
  else if (k === "Delete"){ deleteFromAmt(); e.preventDefault(); }     // langsung hapus baris
  else if (k === "Escape"){
    if (sel !== null){ clearSel(); updatePreview(); setStat("Edit dibatalkan."); }
    else { el.value = ""; lastDate = ""; setDate(""); }
    e.preventDefault();
  }
}
/* ---- SATU juru-antar tombol untuk mode kalkulator ----
   Tujuan tombol ditentukan HANYA oleh activeField (kolom mana yang sedang
   dipakai), persis seperti tombol numpad. Sengaja TIDAK memakai
   document.activeElement untuk memilih kolom: sebagian penangan memindahkan
   fokus di tengah jalan (angka ke-4 tanggal, Enter, panah kanan), jadi
   elemen yang fokus saat tombol ditekan bisa berbeda dengan saat diperiksa —
   dulu itu membuat angka ke-4 tanggal ikut masuk ke Nominal.
   Karena hanya ada satu penangan, tidak ada lagi urusan urutan/propagasi. */
document.addEventListener("keydown", e => {
  // modal pengaturan terbuka: Esc menutup, tombol lain tidak masuk kalkulator
  if (setOpen){
    if (e.key === "Escape"){ closeSettings(); e.preventDefault(); }
    return;
  }
  if (mode !== "calc") return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;   // mis. Ctrl+P: biarkan lewat
  const amt = $("inAmt"), dte = $("inDate"), ae = document.activeElement;
  // kontrol lain (pilihan printer, kotak teks, dsb.) mengetik untuk dirinya sendiri
  if (ae && ae !== amt && ae !== dte &&
      /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;
  if (usedate && activeField === "date"){
    if (ae !== dte) focusDate();          // mis. habis mengetuk baris pita
    dateKey(e);
  } else {
    if (ae !== amt) focusAmt();
    amtKey(e);
  }
});
/* ---- kolom Tanggal: saat difokus tampil angka mentah (DDMM), saat ditinggalkan
   tampil "d/m"; Enter / panah-kanan-di-ujung lompat ke Nominal ---- */
$("inAmt").addEventListener("focus", () => { activeField = "amt"; });
$("inDate").addEventListener("focus", () => { activeField = "date"; const el=$("inDate"); el.value = el.dataset.raw || ""; moveCaretEnd(el); });
$("inDate").addEventListener("blur", () => setDate($("inDate").dataset.raw));
$("inDate").addEventListener("input", () => {
  const el=$("inDate"); el.dataset.raw = el.value.replace(/\D/g,"").slice(0,4); el.value = el.dataset.raw;
  setDateCarried(false);   // disunting sendiri (tempel/ketik bawaan), bukan bawaan
});
/* satu tempat aturan tombol kolom Tanggal: dipakai kolomnya sendiri, dan
   dipakai ulang oleh keydown dokumen saat tak ada kolom yang difokus */
function dateKey(e){
  const el = $("inDate"), k = e.key;
  /* angka selalu lewat padDateDigit, sama seperti tombol numpad. Kolom ini
     dibuat read-only di layar sentuh supaya papan ketik HP/tablet tak muncul —
     ketikan bawaan tidak akan masuk, jadi angkanya harus dimasukkan sendiri.
     Kolom Nominal memang sudah bekerja begini di semua ukuran. */
  if (/^[0-9]$/.test(k)){ padDateDigit(k); e.preventDefault(); return; }
  if (k === "Enter" && !e.shiftKey){                        // Tanggal -> Nominal
    // Enter = menyetujui tanggal (termasuk yang terbawa) -> tulisan normal lagi
    setDate(el.dataset.raw); setDateCarried(false); focusAmt(); e.preventDefault();
  } else if (k === "ArrowRight"){                            // di ujung kanan -> Nominal
    if (el.selectionStart >= el.value.length){
      setDate(el.dataset.raw); setDateCarried(false);
      focusAmt(); moveCaretStart($("inAmt")); e.preventDefault();
    }
  } else if (k === "ArrowUp"){ selectPrev(); e.preventDefault(); }   // pilih baris sebelumnya
  else if (k === "ArrowDown"){ selectNext(); e.preventDefault(); }   // pilih baris berikutnya
  else if (k === "Backspace" || k === "Delete"){
    // kolom kosong -> hapus baris pita (mis. baris TOTAL), sama seperti di Nominal
    backspaceDate(); e.preventDefault();
  } else if (k === "Escape"){
    if (sel !== null){ clearSel(); updatePreview(); setStat("Edit dibatalkan."); }
    else { $("inAmt").value = ""; lastDate = ""; setDate(""); }
    e.preventDefault();
  }
  // ArrowLeft di ujung kiri: kolom paling kiri, biarkan caret bergerak normal
}
$("togDate").onclick = () => {
  usedate = !usedate; saveAll(); applyUsedate();
  if (mode === "calc"){
    if (usedate){ setDate(""); focusDate(); } else $("inAmt").focus();
    setStat(usedate ? "Kolom tanggal aktif (d/m). Enter: ke Nominal, Shift+Enter: kembali."
                    : "Kolom tanggal mati.");
  }
};
$("togRibu").onclick = () => {
  ribu = !ribu; saveAll(); refreshToggles();
  // sedang mengedit baris: sesuaikan tampilan Nominal dengan mode baru
  if (sel !== null) $("inAmt").value = amtToInput(curTape()[sel][1]);
  if (mode === "calc"){
    focusAmt();
    setStat(ribu ? "×1000 aktif: angka yang diketik dikalikan 1000." : "×1000 mati.");
  }
};
/* init */
applyTheme();
initGrip(); initColGrip(); applyUsedate(); refreshToggles(); applyMode(); initBridge();
</script>
