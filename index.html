<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Cetak Draft Pesanan</title>
<!-- Tema dipasang SEBELUM halaman digambar, supaya tidak berkedip putih dulu
     saat tema gelap dipakai. Pilihan tersimpan di cdp_theme; kalau belum
     pernah dipilih, ikut pengaturan sistem.
     Kunci "cdp_theme" sengaja ditulis apa adanya di sini: skrip ini berjalan
     sebelum skrip utama, jadi tabel STORE belum ada. Kalau kuncinya berubah,
     ubah di kedua tempat. -->
<script>
try{
  var t = localStorage.cdp_theme;
  if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  document.documentElement.dataset.theme = t;
}catch(e){ document.documentElement.dataset.theme = "light"; }
</script>
<style>
  /* ================= warna =================
     Dua tema, dipilih lewat data-theme di <html> (lihat tombol ☾/☀ di kanan
     atas). Semua warna lewat variabel ini - jangan tulis kode warna langsung,
     nanti tema gelapnya bolong.
     --key* khusus tombol numpad: sengaja dibuat jelas beda dari --bg (latar
     panel numpad) supaya tiap tombol kelihatan timbul, tidak menyatu. */
  /* Gaya numpad meniru papan ketik bawaan HP: tombol TANPA garis tepi,
     permukaan terang (--key) di atas latar numpad yang sedikit lebih gelap
     (--padbg), plus satu bayangan tipis di bawah. Kontrasnya dari selisih
     nada permukaan, bukan dari garis - itulah yang membuatnya mulus. */
  :root, :root[data-theme="light"]{
    --bg:#f2f4f8; --card:#fff; --border:#e3e7ee; --accent:#3565f0;
    --accent-dark:#2a52cc; --text:#181c24; --muted:#68707f;
    --ok:#178a4c; --err:#d43d32; --seg:#e7eaf0; --on:#dde7ff; --input:#f4f6fa;
    --padbg:#dbe0e9; --key:#fff; --key-press:#d3d9e4;
    --key-acc:#cfdfff; --key-dan:#ffd9d4; --seg-act:#fff;
    --paper:#fff; --paper-ink:#181c24;
    --grip:#b2bac8; --shadow:rgba(24,28,36,.14); --shadow-soft:rgba(24,28,36,.08);
    --key-edge:rgba(24,28,36,.22); --scrim:rgba(24,28,36,.42);
  }
  :root[data-theme="dark"]{
    --bg:#14171d; --card:#1d2129; --border:#2b303b; --accent:#85a8ff;
    --accent-dark:#a5bfff; --text:#e9ecf2; --muted:#99a2b1;
    --ok:#4ecb8d; --err:#ff8078; --seg:#262b35; --on:#293d63; --input:#171a21;
    --padbg:#101319; --key:#2c313c; --key-press:#3b414f;
    --key-acc:#2d4068; --key-dan:#4a2c2e; --seg-act:#363c48;
    --paper:#eceff5; --paper-ink:#181c24;
    --grip:#4c5566; --shadow:rgba(0,0,0,.5); --shadow-soft:rgba(0,0,0,.3);
    --key-edge:rgba(0,0,0,.55); --scrim:rgba(0,0,0,.58);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  /* overscroll-behavior-y: matikan tarik-untuk-muat-ulang. Aplikasi ini
     menyimpan pita di localStorage tiap perubahan, tapi memuat ulang di
     tengah pekerjaan tetap mengagetkan - dan tidak pernah disengaja di sini. */
  html{overscroll-behavior-y:contain}
  body{margin:0; background:var(--bg); color:var(--text);
       font-family:-apple-system,"Segoe UI",sans-serif; padding-bottom:90px;
       overscroll-behavior-y:contain}
  .top{display:flex; align-items:center; gap:8px; padding:12px 14px 6px}
  .top h1{font-size:17px; margin:0; flex:1}
  .btn{border:0; border-radius:10px; cursor:pointer; font-family:inherit}
  #btnBT{background:var(--seg); color:var(--muted); padding:9px 12px; font-size:13px; font-weight:600}
  #btnBT.on{background:var(--on); color:var(--accent)}
  #btnTheme{background:var(--seg); color:var(--muted); font-size:15px; line-height:1;
            padding:8px 11px}
  /* pilihan printer (hanya tampil bila jembatan cetak PC terdeteksi) */
  #selPrinter{display:none; background:var(--seg); color:var(--text); border:0;
              border-radius:10px; padding:9px 10px; font-size:13px; font-family:inherit;
              max-width:48vw}
  .rowbar{display:flex; gap:6px; padding:6px 14px; flex-wrap:wrap; align-items:center}
  .seg{display:flex; background:var(--seg); border-radius:10px; padding:3px}
  .seg .btn{background:transparent; color:var(--muted); padding:8px 14px; font-size:13px}
  .seg .btn.act{background:var(--seg-act); color:var(--accent); font-weight:700}
  .tog{background:var(--seg); color:var(--muted); padding:8px 12px; font-size:13px}
  .tog.act{background:var(--on); color:var(--accent); font-weight:700}
  .card{background:var(--card); border:1px solid var(--border); border-radius:14px;
        margin:6px 14px; overflow:hidden}
  .card .cap{font-size:10px; font-weight:700; color:var(--muted); padding:10px 14px 2px;
             letter-spacing:.4px}
  textarea{width:100%; border:0; outline:none; font:inherit; font-size:16px;
           padding:8px 14px 12px; min-height:170px; resize:vertical; background:transparent}
  /* kalkulator */
  /* satu baris: navigasi pita di kiri, Total di kanan. Semua dijaga agar
     TIDAK melipat ke baris kedua (nowrap) supaya pratinjau kebagian ruang. */
  #calcNav{display:flex; align-items:center; gap:5px; padding:6px 14px 2px;
           font-size:11px; color:var(--muted); white-space:nowrap}
  #calcNav .btn{background:transparent; color:var(--muted); font-size:13px;
                padding:2px 5px; line-height:1}
  /* kalau ruang benar-benar mepet (kolom numpad disempitkan + total sangat
     besar), label pita yang mengalah lebih dulu — Total harus tetap terbaca */
  #tapeLbl{flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis}
  #calcNav #btnNew{font-size:11px; padding:4px 8px; border-radius:8px;
                   font-weight:700; line-height:1.1;
                   background:var(--on); color:var(--accent)}
  /* aksi merusak: beri warna peringatan di dalam modal */
  #btnHist{color:var(--err); background:var(--key-dan)}
  /* kolom numpad bisa sesempit 280px, jadi Total dijaga ringkas & tak melipat.
     Urutan mengalah bila ruang benar-benar habis: label pita dulu, baru ekor
     angka total — barisnya sendiri TIDAK pernah melebar keluar kartu. */
  #calcTotal{margin-left:auto; padding-left:4px; color:var(--accent);
             font-weight:700; font-size:13px;
             flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis}
  .inrow{display:flex; gap:8px; padding:6px 14px}
  /* color WAJIB ditulis: input tidak mewarisi warna teks, dan bawaan peramban
     hitam - di tema gelap angkanya jadi tak terbaca */
  .inrow input{border:1px solid var(--border); border-radius:10px; background:var(--input);
               color:var(--text); caret-color:var(--accent);
               font-family:ui-monospace,Menlo,monospace; outline:none; padding:10px}
  .inrow input::placeholder{color:var(--muted); opacity:.7}
  #inDate{width:88px; font-size:15px; text-align:center; color:var(--text)}
  /* tanggal warisan baris sebelumnya: redup dulu, jadi normal setelah Enter */
  #inDate.carried{color:var(--muted)}
  #inAmt{flex:1; font-size:22px; text-align:right; min-width:0}
  #editBar{display:none; margin:0 14px; padding:8px 12px; background:var(--on); color:var(--accent);
           border-radius:10px; font-size:13px; font-weight:600; align-items:center; gap:8px}
  #editBar .btn{padding:6px 10px; font-size:12px}
  #btnDelRow{background:var(--key-dan); color:var(--err)}
  #btnCancelEdit{background:var(--card); color:var(--muted)}
  #pad{display:grid; grid-template-columns:repeat(4,1fr); gap:7px; padding:8px 14px 14px}
  /* tombol gaya papan ketik bawaan: tanpa garis tepi, hanya permukaan terang
     + satu bayangan rambut di bawah (--key-edge). Ditekan = permukaan turun
     senada latar, bayangan hilang - terasa "masuk". */
  #pad .btn{padding:14px 0; font-size:18px; font-weight:600; border-radius:9px;
            background:var(--key); color:var(--text);
            box-shadow:0 1px 0 var(--key-edge)}
  #pad .btn.acc{background:var(--key-acc); color:var(--accent-dark)}
  #pad .btn.dan{background:var(--key-dan); color:var(--err)}
  #pad .btn:active{background:var(--key-press); box-shadow:none; transform:translateY(1px)}
  /* ====== pratinjau: digambar sebagai KERTAS ======
     Lebarnya dikunci tepat selebar hasil cetak (31 karakter + padding), latar
     putih & bergaris tepi, lalu ditaruh di TENGAH panel lewat margin auto.
     Satuan ch = lebar satu karakter font monospace, jadi 31ch persis sama
     dengan lebar kertas 58mm yang dipakai printer. */
  #preview{--kertas:12px;                       /* padding kiri-kanan kertas */
           font-family:ui-monospace,Menlo,Consolas,monospace; font-size:12px;
           line-height:1.5; overflow-x:auto; min-height:60px;
           width:calc(31ch + 2 * var(--kertas) + 2px);   /* +2px = garis tepi */
           max-width:100%; margin:8px auto; padding:10px var(--kertas);
           background:var(--paper); color:var(--paper-ink);
           border:1px solid var(--border); border-radius:3px;
           box-shadow:0 1px 3px var(--shadow), 0 6px 16px var(--shadow-soft)}
  /* kertas putih perlu latar yang lebih gelap sedikit supaya tepinya terbaca */
  #previewCard{background:var(--bg)}
  /* Baris nominal bisa ditahan lalu digeser untuk mengubah urutan.
     user-select/touch-callout dipasang PERMANEN, bukan cuma saat menggeser:
     iOS memutuskan mau menyorot teks atau tidak sejak jari menyentuh, jadi
     memasangnya setelah baris terangkat sudah terlambat. Cakupannya hanya
     .row (yang cuma ada di mode kalkulator), jadi teks pratinjau di mode
     Tabel/Teks polos tetap bisa disorot dan disalin. */
  #preview .row{display:inline; cursor:grab;
                user-select:none; -webkit-user-select:none;
                -webkit-touch-callout:none}
  #preview .row.sel{background:var(--on); color:var(--accent); border-radius:4px}
  /* baris yang sedang diangkat: senada baris terpilih + garis putus-putus */
  #preview .row.drag{background:var(--on); color:var(--accent); border-radius:4px;
                     outline:1px dashed var(--accent)}
  /* selama memindah: jangan ikut menyeret sorotan teks */
  #preview.menggeser{cursor:grabbing; user-select:none; -webkit-user-select:none}
  /* mode kalkulator: pita jadi jendela tinggi tetap di atas numpad */
  #previewCard.calc{border:0; margin:0; background:transparent}
  #previewCard.calc .cap{display:none}
  /* tinggi diatur JS (layoutCalc); min-height:0 supaya tak menabrak numpad.
     overscroll-behavior: pita punya gulungan sendiri; saat mentok jangan
     merambat ke halaman - di Bluefy itu berlanjut jadi tarik-untuk-muat-ulang
     dan pita yang belum dicetak ikut hilang dari layar. */
  #previewCard.calc #preview{overflow-y:auto; margin:6px auto 2px; min-height:0;
                             overscroll-behavior:contain}
  /* numpad menempel di bawah (di atas bilah CETAK); posisi diatur JS */
  /* latar numpad sedikit lebih gelap dari halaman: tombol putih "mengambang"
     di atasnya tanpa perlu garis tepi */
  #calcKeys{background:var(--padbg)}
  body.calc #calcKeys{border-top:1px solid var(--border);
    padding:0 0 2px; box-shadow:0 -6px 14px var(--shadow-soft);
    display:flex; flex-direction:column}
  /* numpad menyusut mengikuti tinggi yang diseret pengguna */
  body.calc #pad{flex:1 1 auto; min-height:0; grid-auto-rows:1fr; padding:6px 14px 8px}
  body.calc #pad .btn{padding:0; min-height:0}
  /* pegangan seret (hanya mode kalkulator di layar sempit) */
  #keysGrip{display:none}
  body.calc #keysGrip{display:block; position:relative; height:20px; flex:0 0 20px;
    touch-action:none; cursor:ns-resize}
  body.calc #keysGrip::before{content:""; position:absolute; left:50%; top:7px;
    transform:translateX(-50%); width:44px; height:5px; border-radius:3px; background:var(--grip)}
  body.calc #keysGrip:active::before{background:var(--accent)}
  /* pemisah kolom (layar lebar / tablet mendatar): geser untuk mengatur lebar
     numpad — pratinjau otomatis mengisi sisa ruang. Hanya mode kalkulator. */
  #colGrip{display:none}
  .foot{position:fixed; left:0; right:0; bottom:0; background:var(--bg);
        border-top:1px solid var(--border); display:flex; gap:8px; align-items:center;
        padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
  #btnPrint{background:var(--accent); color:var(--card); font-size:16px; font-weight:700; padding:14px 26px}
  #btnPrint:disabled{opacity:.5}
  #btnClear{background:var(--seg); color:var(--text); font-size:14px; padding:14px 16px}
  /* status melar mengisi ruang kiri (mendorong tombol ke kanan), teksnya
     sendiri rata kiri di tepi halaman */
  #stat{flex:1; font-size:12px; color:var(--muted); text-align:left}
  #stat.ok{color:var(--ok)} #stat.err{color:var(--err)}
  /* ====== layar sempit (HP): kartu menumpuk (default) ====== */
  /* caption kalkulator: judul + tombol toggle Tanggal (tampil di semua ukuran) */
  .calcCap{display:flex; align-items:center; gap:10px}
  #togDate{padding:5px 10px; font-size:11px}
  /* tombol OCR di pojok kanan caption panel teks */
  #btnOcr{margin-left:auto; padding:5px 10px; font-size:11px}
  /* ====== pengaturan tampilan (modal di balik tombol gerigi) ====== */
  #btnGear{font-size:16px; line-height:1; padding:8px 12px}
  #btnCalcGear{margin-left:auto; font-size:14px; line-height:1; padding:5px 9px}
  .modalBack{position:fixed; inset:0; z-index:50; padding:16px;
             background:var(--scrim);
             display:flex; align-items:center; justify-content:center}
  .modalBack[hidden]{display:none}
  .modalPanel{margin:0; width:min(340px,100%); max-height:80vh; overflow:auto;
              box-shadow:0 14px 44px var(--shadow)}
  .modalList{display:flex; flex-direction:column; gap:8px; padding:8px 14px 4px}
  .modalList .btn{width:100%; text-align:left; padding:12px 14px; font-size:14px}
  .modalClose{display:block; width:calc(100% - 28px); margin:8px 14px 14px;
              background:var(--seg); color:var(--text); padding:11px 14px; font-size:14px}
  /* ====== layar lebar (desktop): input kiri, pratinjau kanan ====== */
  @media (min-width:768px){
    body{padding-bottom:0}
    /* baris mode + baris toggle jadi satu baris di tata letak kiri-kanan */
    .rowbar{display:inline-flex; vertical-align:middle}
    .rowbar + .rowbar{padding-left:2px}
    #stage{display:flex; gap:14px; align-items:stretch; margin:6px 14px}
    #stage>.card{margin:0}
    #panelText{flex:1.3 1 0; display:flex; flex-direction:column}
    #panelText textarea{flex:1 1 auto; min-height:0}
    #panelCalc{flex:0 0 360px; display:flex; flex-direction:column}
    #panelCalc #calcKeys{flex:1 1 auto; display:flex; flex-direction:column}
    #panelCalc #pad{flex:1 1 auto; grid-auto-rows:1fr}
    #previewCard{flex:1 1 0; display:flex; flex-direction:column; min-height:0}
    #previewCard .cap{flex:0 0 auto}
    #previewCard #preview{flex:1 1 0; min-height:0; overflow:auto}
    #btlog{display:none}
    /* di desktop numpad TIDAK menempel ke bawah layar */
    body.calc #calcKeys{border:0; box-shadow:none}
    /* tukar sisi: panel isian ke kanan, pratinjau ke kiri */
    #stage.rev{flex-direction:row-reverse}
    /* pegangan pemisah kolom (dinyalakan JS lewat kelas .on) */
    #colGrip.on{display:block; position:relative; flex:0 0 14px; align-self:stretch;
      touch-action:none; cursor:col-resize}
    #colGrip.on::before{content:""; position:absolute; top:50%; left:50%;
      transform:translate(-50%,-50%); width:5px; height:44px; border-radius:3px;
      background:var(--grip)}
    #colGrip.on:active::before{background:var(--accent)}
  }
</style>
</head>
<body>

<div class="top">
  <h1>Cetak Draft Pesanan</h1>
  <select id="selPrinter" title="Pilih printer"></select>
  <button class="btn" id="btnTheme" aria-label="Ganti tema terang/gelap"></button>
  <button class="btn" id="btnBT">&#9679; Hubungkan</button>
</div>

<div class="rowbar">
  <div class="seg" id="segMode">
    <button class="btn" data-m="table">Tabel</button>
    <button class="btn" data-m="plain">Teks polos</button>
    <button class="btn" data-m="calc">Kalkulator</button>
  </div>
  <button class="btn tog" id="btnGear" title="Pengaturan tampilan"
          aria-haspopup="dialog" aria-expanded="false">&#9881;</button>
</div>

<!-- pengaturan tampilan: tombol-tombol yang dulu berjajar di bawah baris mode.
     Elemennya SAMA (id tidak berubah), hanya pindah tempat, jadi semua logika
     yang memakainya (refreshToggles dll) tetap berjalan. -->
<div id="setBack" class="modalBack" hidden>
  <div class="card modalPanel" id="setPanel" role="dialog" aria-modal="true"
       aria-label="Pengaturan tampilan">
    <div class="cap">PENGATURAN TAMPILAN</div>
    <div class="modalList">
      <button class="btn tog" id="togNum">Nomor urut</button>
      <button class="btn tog" id="togHead">Tanggal &amp; garis</button>
      <button class="btn tog" id="togAuto" style="display:none">Auto-cetak</button>
      <button class="btn tog" id="togSwap" style="display:none"
              title="Tukar posisi panel isian &amp; pratinjau">&#8646; Tukar sisi</button>
    </div>
    <button class="btn modalClose" id="btnSetClose">Tutup</button>
  </div>
</div>

<!-- pengaturan khusus kalkulator, dibuka dari gerigi di baris KALKULATOR PITA -->
<div id="calcSetBack" class="modalBack" hidden>
  <div class="card modalPanel" id="calcSetPanel" role="dialog" aria-modal="true"
       aria-label="Pengaturan kalkulator">
    <div class="cap">PENGATURAN KALKULATOR</div>
    <div class="modalList">
      <button class="btn tog" id="togDate"
              title="Kolom tanggal d/m di tiap baris">Tanggal per baris</button>
      <button class="btn tog" id="togRibu"
              title="Angka yang diketik dikalikan 1000">&times;1000</button>
      <button class="btn tog" id="btnZeroC"
              title="Tampilkan baris 0 C di awal tiap pita">Baris 0 C</button>
      <button class="btn tog" id="togHaptic"
              title="Getar tiap tombol numpad ditekan; bila perangkat tak bisa getar, diganti bunyi klik">Getar / bunyi tombol</button>
      <!-- jarang dipakai & merusak (ada konfirmasi), jadi disimpan di sini
           supaya baris navigasi cukup untuk Pita/Baru/Total tanpa melipat -->
      <button class="btn" id="btnHist"
              title="Hapus SEMUA riwayat pita">Hapus riwayat pita</button>
    </div>
    <button class="btn modalClose" id="btnCalcSetClose">Tutup</button>
  </div>
</div>

<div id="stage">

<div class="card" id="panelText">
  <div class="cap calcCap">
    <span id="capText">KETIK PESANAN — SATU BARANG PER BARIS</span>
    <button class="btn tog" id="btnOcr" title="Baca teks dari foto/gambar (OCR)">&#128247; Foto</button>
    <input type="file" id="ocrFile" accept="image/*" hidden>
  </div>
  <textarea id="txt" placeholder="Besi beton 8 mm 10 btg&#10;Semen 5 sak&#10;Gypsum 6 lbr"></textarea>
</div>

<div class="card" id="panelCalc" style="display:none">
  <div class="cap calcCap">
    <span>KALKULATOR PITA</span>
    <button class="btn tog" id="btnCalcGear" title="Pengaturan kalkulator"
            aria-haspopup="dialog" aria-expanded="false">&#9881;</button>
  </div>
  <div id="calcNav">
    <button class="btn" id="btnPrev">&#9664;</button>
    <span id="tapeLbl">Pita 1/1</span>
    <button class="btn" id="btnNext">&#9654;</button>
    <button class="btn" id="btnNew" title="Buat pita baru">Baru</button>
    <div id="calcTotal">Total: 0 (0 nota)</div>
  </div>
  <div id="calcKeys">
  <div id="keysGrip" title="Geser untuk mengatur tinggi numpad (ketuk dua kali: otomatis)"></div>
  <div class="inrow" id="calcInRow">
    <input id="inDate" placeholder="h/b" maxlength="5" inputmode="numeric">
    <input id="inAmt" placeholder="0" inputmode="decimal">
  </div>
  <div id="editBar"><span id="editLbl"></span>
    <button class="btn" id="btnDelRow">Hapus</button>
    <button class="btn" id="btnCancelEdit">Batal</button>
  </div>
  <div id="pad">
    <button class="btn dan" data-k="C">C</button>
    <button class="btn" data-k="BS">&#9003;</button>
    <button class="btn" data-k="SUB">SUB</button>
    <button class="btn acc" data-k="TOT">TOTAL</button>
    <button class="btn" data-k="7">7</button><button class="btn" data-k="8">8</button>
    <button class="btn" data-k="9">9</button><button class="btn acc" data-k="+">+</button>
    <button class="btn" data-k="4">4</button><button class="btn" data-k="5">5</button>
    <button class="btn" data-k="6">6</button><button class="btn" data-k="-">&#8722;</button>
    <button class="btn" data-k="1">1</button><button class="btn" data-k="2">2</button>
    <button class="btn" data-k="3">3</button><button class="btn" data-k="00">00</button>
    <button class="btn" data-k="0">0</button><button class="btn" data-k="000">000</button>
    <button class="btn" data-k=".">.</button><button class="btn dan" data-k="CA">CA</button>
  </div>
  </div>
</div>

<div id="colGrip" title="Geser untuk mengatur lebar numpad (ketuk dua kali: otomatis)"></div>

<div class="card" id="previewCard">
  <div class="cap">PRATINJAU</div>
  <pre id="preview"></pre>
</div>

</div><!-- /stage -->

  <pre id="btlogtxt" style="font-family:ui-monospace,Menlo,monospace; font-size:10px; margin:0; padding:0 14px; white-space:pre-wrap; word-break:break-all; color:var(--muted)"></pre>

<!-- urutan sengaja: status dulu (melar mengisi ruang) supaya tombol terdorong
     ke kanan — CETAK paling kanan, Bersihkan di sebelah kirinya. Urutan DOM
     dibuat sama dengan urutan tampilan agar urutan Tab ikut benar. -->
<div class="foot">
  <div id="stat">Siap.</div>
  <button class="btn" id="btnClear">Bersihkan</button>
  <button class="btn" id="btnPrint">CETAK</button>
</div>

<!-- SEMUA logika parsing/format ada di core.js (dibagi PC & iPhone) -->
<script src="core.js?v=28"></script>
<script>
"use strict";
/* ================= status & state ================= */
const $ = id => document.getElementById(id);
const statEl = $("stat");
function setStat(msg, cls){ statEl.textContent = msg; statEl.className = cls || ""; }

/* ================= pengaturan tersimpan =================
   Satu-satunya tempat yang menyentuh localStorage. Kunci "cdp_*" adalah DATA
   yang sudah ada di HP pengguna - namanya tidak boleh diubah, hanya dikumpulkan
   di sini supaya tidak berserak di seluruh berkas. */
const STORE = {
  mode: "cdp_mode", rowNumbers: "cdp_num", headers: "cdp_head",
  autoPrint: "cdp_auto", useDate: "cdp_usedate", zeroClear: "cdp_zeroc",
  thousands: "cdp_ribu", haptic: "cdp_haptic", text: "cdp_text",
  tapes: "cdp_tapes", theme: "cdp_theme", keypadHeight: "cdp_keysh",
  calcWidth: "cdp_calcw", previewLeft: "cdp_swap", printer: "cdp_printer",
};
const MODE_TABLE = "table", MODE_PLAIN = "plain", MODE_CALC = "calc";
const LEGACY_MODES = {excel: MODE_TABLE};      // mode Excel sudah dihapus

/* localStorage TIDAK selalu tersedia. Di mode penyamaran Safari/Bluefy
   menulis ke sana melempar, dan kalau kuki diblokir sama sekali, menyentuh
   objeknya saja sudah melempar. Aplikasi harus tetap jalan: yang hilang cuma
   penyimpanan pengaturan, bukan kemampuan mencetak.

   Membaca yang gagal -> pakai nilai bawaan, diam saja (pengguna sudah melihat
   sendiri pitanya kosong). Menulis yang gagal -> beri tahu SEKALI: itu yang
   perlu diketahui, karena pekerjaannya tidak akan tersimpan. */
let storageWarningShown = false;

function reportStorageUnavailable(){
  if (storageWarningShown) return;
  storageWarningShown = true;
  // Ditunda satu putaran: penangan yang sedang berjalan biasanya menutup
  // pekerjaannya dengan setStat sendiri ("Siap.", "Semua baris dihapus."),
  // dan tanpa penundaan ini peringatannya langsung tertimpa - pengguna tak
  // akan pernah melihatnya.
  setTimeout(() => setStat("Pengaturan & riwayat pita tidak bisa disimpan di "
                           + "mode ini (penyamaran?) - mencetak tetap bisa.",
                           "err"), 0);
}

function readStored(key){
  try { return localStorage[key]; }
  catch (tanpaPenyimpanan){ return undefined; }
}
function writeStored(key, value){
  try { localStorage[key] = value; }
  catch (tanpaPenyimpanan){ reportStorageUnavailable(); }
}
function removeStored(key){
  try { delete localStorage[key]; }
  catch (tanpaPenyimpanan){ reportStorageUnavailable(); }
}

const readText = (key, fallback = "") => readStored(key) || fallback;
/* Sakelar disimpan sebagai "1"/"0". Yang bawaannya NYALA hanya mati kalau
   tertulis "0"; yang bawaannya MATI hanya nyala kalau tertulis "1". */
const readFlag = (key, defaultOn) =>
  defaultOn ? readStored(key) !== "0" : readStored(key) === "1";
const writeFlag = (key, on) => writeStored(key, on ? "1" : "0");
const readPixels = key => parseInt(readStored(key) || "0", 10) || 0;

const savedMode = readText(STORE.mode, MODE_TABLE);
let mode = LEGACY_MODES[savedMode] || savedMode;
let numbered = readFlag(STORE.rowNumbers, true);
let headers = readFlag(STORE.headers, true);
let autoprint = readFlag(STORE.autoPrint, false);
let usedate = readFlag(STORE.useDate, false);      // kolom tanggal per-baris
let zeroc = readFlag(STORE.zeroClear, true);       // baris "0 C" di awal tiap pita
let ribu = readFlag(STORE.thousands, false);       // ×1000: nominal diketik dalam ribuan
let haptic = readFlag(STORE.haptic, true);         // getar/bunyi tiap tombol numpad
/* batas riwayat pita: 5 riwayat + 1 pita aktif (sama dengan MAX_TAPES di printapp.py) */
const MAX_TAPES = 6;
const TAPE_KINDS = new Set(["e", "s", "c", "t"]);
/* localStorage bisa berisi apa saja: versi lama, sunting tangan, penyimpanan
   yang terpotong. Satu nilai rusak saja dulu bisa melempar di resolveTape dan
   mematikan SELURUH rantai init di bawah - halaman jadi tak bisa dipakai, dan
   karena nilai rusaknya tetap tersimpan, memuat ulang pun tak menolong.
   Jadi saring dulu di sini; printapp.py menyaring "riwayat" dengan cara sama. */
function sanitizeTapes(raw){
  if (!Array.isArray(raw)) return null;
  const clean = raw.filter(Array.isArray).map(tape => tape.filter(ev =>
    Array.isArray(ev) && TAPE_KINDS.has(ev[0]) &&
    (ev[0] !== "e" || (typeof ev[1] === "number" && isFinite(ev[1])))))
    .filter(tape => tape.length);   // pita yang habis disaring: buang, jangan sisakan kosong
  return clean.length ? clean.slice(-MAX_TAPES) : null;
}
let tapes = [[["c"]]], active = 0, sel = null, tapesRusak = false;
try {
  const raw = JSON.parse(readText(STORE.tapes, "null"));
  const bersih = sanitizeTapes(raw);
  if (bersih) tapes = bersih;
  else if (raw !== null) tapesRusak = true;
} catch(e){ tapesRusak = true; }
active = tapes.length - 1;
$("txt").value = readText(STORE.text);

const curTape = () => tapes[active];
function saveAll(){
  writeStored(STORE.mode, mode);
  writeFlag(STORE.rowNumbers, numbered);
  writeFlag(STORE.headers, headers);
  writeFlag(STORE.useDate, usedate);
  writeFlag(STORE.zeroClear, zeroc);
  writeFlag(STORE.thousands, ribu);
  writeFlag(STORE.haptic, haptic);
  writeStored(STORE.text, $("txt").value);
  writeStored(STORE.tapes, JSON.stringify(tapes));
}
/* ================= pratinjau & UI ================= */
let lineMap = {};
/* Pengaturan tampilan yang sama dipakai pratinjau maupun cetak; dikumpulkan
   di sini supaya tidak ada deretan argumen yang disalin-salin. */
function draftOptions(){
  return {showRowNumbers: numbered, columns: COLS, now: new Date(), showHeaders: headers};
}
function tapeOptions(){
  return {...draftOptions(), showZeroClearLine: zeroc};
}
function currentDraft(){
  if (mode === MODE_CALC)
    return renderCalcTape(curTape(), tapeOptions())[0];
  return formatDraft($("txt").value,
                     {...draftOptions(), plainText: mode === MODE_PLAIN});
}
/* Rangkai HTML pita + isi lineMap. Dipisah dari updatePreview() karena
   penggeseran baris memakainya berkali-kali sambil MENAHAN posisi gulir,
   sedangkan updatePreview() justru yang mengatur posisi gulir. */
function tapeHtml(events, selIndex, dragIndex){
  const [text, lmap] = renderCalcTape(events, tapeOptions());
  lineMap = lmap;
  return text.split("\n").map((l, i) => {
    const ev = lineMap[i];
    if (ev === undefined) return escapeHtml(l);
    let kelas = "row";
    if (ev === selIndex) kelas += " sel";
    if (ev === dragIndex) kelas += " drag";
    return `<span class="${kelas}" data-i="${ev}">${escapeHtml(l)}</span>`;
  }).join("\n");
}
function updatePreview(){
  const pv = $("preview");
  if (mode === MODE_CALC){
    pv.innerHTML = tapeHtml(curTape(), sel, null);
    // baris terbaru selalu terlihat; saat mengedit, gulir ke baris terpilih
    layoutCalc();
    if (sel !== null){
      const selSpan = pv.querySelector(".row.sel");
      if (selSpan) selSpan.scrollIntoView({block:"nearest"});
    } else {
      pv.scrollTop = pv.scrollHeight;
    }
  } else {
    lineMap = {};
    pv.textContent = currentDraft();
  }
}
/* Tangkapan penunjuk ditolak bila kejadiannya buatan (uji) atau penunjuknya
   sudah lepas. Keduanya tidak mengubah jalannya geseran, jadi diabaikan. */
function capturePointer(element, pointerId){
  try { element.setPointerCapture(pointerId); }
  catch (penunjukTidakAda){ /* geseran tetap jalan lewat kejadian biasa */ }
}
function releasePointer(element, pointerId){
  try { element.releasePointerCapture(pointerId); }
  catch (sudahLepas){ /* memang sudah tidak tertangkap */ }
}
/* ====== layout responsif ====== */
const mqDesktop = window.matchMedia("(min-width:768px)");
const isDesktop = () => mqDesktop.matches;
/* Lebar layar menentukan TATA LETAK; jenis penunjuk menentukan apakah papan
   ketik bawaan boleh muncul. Dipisah supaya tablet mendatar (lebar, tapi
   sentuh) tetap memakai numpad, dan jendela sempit di PC tetap bisa diketik. */
const mqTouch = window.matchMedia("(pointer: coarse)");
const isTouch = () => mqTouch.matches;
/* ---- tema terang/gelap ----
   theme = "" berarti ikut pengaturan sistem; sekali tombol ditekan, pilihan
   pengguna yang dipakai dan disimpan. Kelas warnanya ada di :root[data-theme]. */
let theme = readText(STORE.theme);
const mqDark = window.matchMedia("(prefers-color-scheme: dark)");
const isDark = () => theme ? theme === "dark" : mqDark.matches;
function applyTheme(){
  document.documentElement.dataset.theme = isDark() ? "dark" : "light";
  // ikonnya menunjukkan tema yang AKAN dipakai kalau ditekan
  $("btnTheme").textContent = isDark() ? "☀" : "☾";
  $("btnTheme").title = isDark() ? "Ganti ke tema terang" : "Ganti ke tema gelap";
}
mqDark.addEventListener("change", () => { if (!theme) applyTheme(); });

/* desktop: tinggi panggung mengisi ruang sampai bilah CETAK, agar
   panel kiri & pratinjau kanan sama tinggi & sejajar */
function layoutDesktop(){
  const stage = $("stage");
  if (!isDesktop()){ stage.style.height = ""; return; }
  const footH = document.querySelector(".foot").getBoundingClientRect().height;
  const top = stage.getBoundingClientRect().top;
  stage.style.height = Math.max(340, Math.floor(window.innerHeight - top - footH - 12)) + "px";
}
/* HP: numpad menempel di bawah, tingginya bisa diseret; sisanya untuk pita.
   keysH = 0 berarti otomatis (proporsional terhadap tinggi layar). */
const MIN_KEYS = 170, MIN_PREVIEW = 120, FLOOR_PREVIEW = 60, GAP = 8, KEYS_RATIO = 0.55;
let keysH = readPixels(STORE.keypadHeight);

function layoutCalc(){
  const keys = $("calcKeys"), pv = $("preview");
  if (!(mode === MODE_CALC && !isDesktop())){
    keys.style.position = keys.style.left = keys.style.right =
      keys.style.bottom = keys.style.zIndex = keys.style.height = "";
    pv.style.height = "";
    return;
  }
  const footH = document.querySelector(".foot").getBoundingClientRect().height;
  keys.style.position = "fixed";
  keys.style.left = "0"; keys.style.right = "0";
  keys.style.bottom = footH + "px";
  keys.style.zIndex = "10";

  // ruang yang tersedia dari atas pita sampai bilah CETAK
  keys.style.height = "";                       // ukur tinggi alami numpad dulu
  const natural = keys.offsetHeight;
  const top = pv.getBoundingClientRect().top;
  const avail = window.innerHeight - footH - top - GAP;

  // batas: numpad cukup besar untuk dipakai, pita selalu kebagian sisa ruang
  const minKeys = Math.min(MIN_KEYS, Math.max(110, avail - FLOOR_PREVIEW));
  const maxKeys = Math.max(minKeys, avail - FLOOR_PREVIEW);
  // otomatis: tak lebih dari KEYS_RATIO ruang, tak lebih tinggi dari alaminya,
  // dan sebisanya sisakan MIN_PREVIEW untuk pita
  const auto = Math.min(natural, Math.round(avail * KEYS_RATIO), Math.max(minKeys, avail - MIN_PREVIEW));
  let h = Math.max(minKeys, Math.min(keysH || auto, maxKeys));

  keys.style.height = h + "px";
  pv.style.height = Math.max(FLOOR_PREVIEW, Math.floor(avail - h)) + "px";
  return h;
}
/* pegangan seret: tarik ke atas = numpad lebih tinggi, ke bawah = pita lebih lega */
function initGrip(){
  const grip = $("keysGrip");
  let startY = 0, startH = 0, dragging = false;
  grip.addEventListener("pointerdown", e => {
    if (!(mode === MODE_CALC && !isDesktop())) return;
    dragging = true; startY = e.clientY; startH = $("calcKeys").offsetHeight;
    capturePointer(grip, e.pointerId);
    e.preventDefault();
  });
  grip.addEventListener("pointermove", e => {
    if (!dragging) return;
    keysH = startH + (startY - e.clientY);   // seret ke atas -> makin tinggi
    layoutCalc();
    e.preventDefault();
  });
  const end = e => {
    if (!dragging) return;
    dragging = false;
    releasePointer(grip, e.pointerId);
    keysH = $("calcKeys").offsetHeight;      // simpan nilai yang sudah dibatasi
    writeStored(STORE.keypadHeight, String(keysH));
  };
  grip.addEventListener("pointerup", end);
  grip.addEventListener("pointercancel", end);
  // ketuk dua kali -> kembali ke tinggi otomatis
  grip.addEventListener("dblclick", () => {
    keysH = 0; removeStored(STORE.keypadHeight); layoutCalc();
    setStat("Tinggi numpad otomatis.");
  });
}
/* ====== layar lebar / tablet mendatar: lebar kolom numpad bisa diseret ======
   Pratinjau memakai flex:1, jadi sisa ruang otomatis jadi miliknya: numpad
   melebar -> pratinjau menyempit, dan sebaliknya. calcW = 0 berarti otomatis. */
const MIN_CALC_W = 280, MIN_PREV_W = 260, AUTO_CALC_W = 360;
let calcW = readPixels(STORE.calcWidth);
/* Tata letak dua kolom (layar lebar / tablet mendatar): BAWAANNYA pratinjau
   di kiri, panel isian di kanan. panelRight=false menukarnya jadi panel di
   kiri. Arti nilai di cdp_swap tidak berubah ("1" = pratinjau kiri), yang
   berubah hanya bawaannya - jadi pilihan yang sudah pernah disimpan tetap
   dihormati, termasuk kalau dulu sengaja dipilih panel-di-kiri. */
let panelRight = readFlag(STORE.previewLeft, true);

function layoutStage(){
  const panel = $("panelCalc"), grip = $("colGrip");
  const on = isDesktop() && mode === MODE_CALC;
  grip.classList.toggle("on", on);
  if (!on){ panel.style.flex = ""; return; }
  // batas: numpad tetap layak dipakai, pratinjau tetap muat 31 karakter
  const stageW = $("stage").clientWidth;
  const spacer = 14 * 2 + grip.offsetWidth;      // dua jarak antarkolom + pegangan
  const maxW = Math.max(MIN_CALC_W, stageW - spacer - MIN_PREV_W);
  const w = Math.max(MIN_CALC_W, Math.min(calcW || AUTO_CALC_W, maxW));
  panel.style.flex = "0 0 " + w + "px";
  return w;
}
/* pegangan pemisah: seret kiri/kanan. Saat sisi ditukar, arah seret ikut
   terbalik supaya tetap terasa "tarik pemisahnya", bukan "tarik ke kanan". */
function initColGrip(){
  const grip = $("colGrip");
  let startX = 0, startW = 0, dragging = false;
  grip.addEventListener("pointerdown", e => {
    if (!(isDesktop() && mode === MODE_CALC)) return;
    dragging = true; startX = e.clientX;
    startW = $("panelCalc").getBoundingClientRect().width;
    capturePointer(grip, e.pointerId);
    e.preventDefault();
  });
  grip.addEventListener("pointermove", e => {
    if (!dragging) return;
    const dx = e.clientX - startX;
    calcW = Math.round(startW + (panelRight ? -dx : dx));
    layoutStage();
    e.preventDefault();
  });
  const end = e => {
    if (!dragging) return;
    dragging = false;
    releasePointer(grip, e.pointerId);
    calcW = Math.round($("panelCalc").getBoundingClientRect().width);  // simpan hasil yang sudah dibatasi
    writeStored(STORE.calcWidth, String(calcW));
  };
  grip.addEventListener("pointerup", end);
  grip.addEventListener("pointercancel", end);
  grip.addEventListener("dblclick", () => {
    calcW = 0; removeStored(STORE.calcWidth); layoutStage();
    setStat("Lebar numpad otomatis.");
  });
}
/* ====== ubah urutan baris pita dengan menggeser ======
   Baris nominal di pratinjau bisa ditahan lalu digeser untuk mengubah
   urutannya. Aturan pemindahannya sendiri ada di core.js (moveEntryBy), yang
   dipakai juga oleh Alt+Panah di jendela Tk - jadi keduanya bergerak sama.

   Pratinjau JUGA bisa digulir, jadi gerakan tegak harus dibedakan dulu:
     - tetikus/pena : memindah begitu gerakan lewat AMBANG_GESER px
     - sentuh       : tahan TAHAN_GESER ms dulu; bergerak duluan = menggulir

   ATURAN YANG TIDAK BOLEH DILANGGAR (ini pernah lolos sampai ke pengguna):
   kejadian SENTUH selalu dikirim ke elemen yang disentuh PERTAMA KALI, dan
   elemen yang sudah lepas dari dokumen tidak menggelembung ke induknya lagi.
   Jadi span baris yang sedang disentuh WAJIB tetap hidup sepanjang geseran -
   lihat gambar(). Kalau ia dibuang (mis. lewat pv.innerHTML = ...), penangan
   touchmove di bawah tak pernah kebagian kejadian, preventDefault() tak
   pernah jalan, dan peramban mengambil alih: pita ikut tergulir dan di iPhone
   berlanjut jadi tarik-untuk-muat-ulang. */
const AMBANG_GESER = 4, TAHAN_GESER = 400, BATAL_GESER = 10, TEPI_GULIR = 24;
let geserAktif = false;
let baruSajaGeser = false;   // telan satu "click" yang menyusul pointerup

function initRowDrag(){
  const pv = $("preview");
  let timer = null, pointerId = null, mulaiY = 0;
  let indexSeret = null, kerja = null, adaPerubahan = false;
  let spanSeret = null;      // node yang sedang disentuh - lihat gambar()

  function lupakan(){
    clearTimeout(timer); timer = null;
    pointerId = null; indexSeret = null; kerja = null; adaPerubahan = false;
    spanSeret = null;
    geserAktif = false;
    pv.classList.remove("menggeser");
  }

  /* Gambar ulang pita TANPA membuang span yang sedang disentuh: isinya
     dirangkai di wadah lepas dulu, lalu node aslinya dipakai kembali di
     susunan yang baru. Dengan begitu penomoran & subtotal tetap berubah
     langsung sambil digeser, tapi jalur kejadian sentuhnya tidak putus.
     removeChild/appendChild, bukan replaceChildren(): yang terakhir baru
     ada di Safari 16, sedangkan Bluefy ikut WebKit bawaan iOS. */
  function gambar(){
    const atas = pv.scrollTop;
    const wadah = document.createElement("div");
    wadah.innerHTML = tapeHtml(kerja, null, indexSeret);
    const kembar = wadah.querySelector('.row[data-i="' + indexSeret + '"]');
    if (spanSeret && kembar){
      spanSeret.textContent = kembar.textContent;
      spanSeret.className = kembar.className;
      spanSeret.dataset.i = kembar.dataset.i;   // dicari satuLangkah()
      kembar.replaceWith(spanSeret);
    }
    while (pv.firstChild) pv.removeChild(pv.firstChild);
    while (wadah.firstChild) pv.appendChild(wadah.firstChild);
    pv.scrollTop = atas;              // jangan melompat saat digambar ulang
  }

  function mulaiGeser(){
    clearTimeout(timer); timer = null;
    geserAktif = true;
    pv.classList.add("menggeser");
    capturePointer(pv, pointerId);
    try { getSelection().removeAllRanges(); }
    catch (tanpaSorotan){ /* tak ada sorotan yang perlu dilepas */ }
    clearSel();                       // memindah baris bukan mengeditnya
    plusArmed = false;                // dan bukan kelanjutan rantai "+ +"
    padFeedback();
    gambar();
  }

  /* Satu langkah bila penunjuk sudah melewati titik tengah baris tetangga.
     Return true bila ada yang berpindah, supaya pemanggil bisa mengejar
     gerakan cepat. */
  function satuLangkah(y){
    const rows = [...pv.querySelectorAll(".row")];
    const pos = rows.findIndex(r => +r.dataset.i === indexSeret);
    if (pos < 0) return false;
    const tengah = el => {
      const b = el.getBoundingClientRect();
      return b.top + b.height / 2;
    };
    let step = 0;
    if (pos > 0 && y < tengah(rows[pos - 1])) step = -1;
    else if (pos < rows.length - 1 && y > tengah(rows[pos + 1])) step = 1;
    if (!step) return false;
    const hasil = moveEntryBy(kerja, indexSeret, step);
    if (!hasil) return false;
    kerja = hasil[0];
    indexSeret = hasil[1];
    adaPerubahan = true;
    gambar();
    return true;
  }

  function gulirTepi(y){
    const b = pv.getBoundingClientRect();
    if (y < b.top + TEPI_GULIR) pv.scrollTop -= 8;
    else if (y > b.bottom - TEPI_GULIR) pv.scrollTop += 8;
  }

  function jatuhkan(){
    if (!geserAktif){ lupakan(); return; }
    if (adaPerubahan){
      tapes[active] = kerja;
      padFeedback();
      setStat("Urutan baris diubah.", "ok");
    }
    baruSajaGeser = true;
    lupakan();
    const atas = pv.scrollTop;
    refreshCalcHead(); updatePreview(); saveAll();
    pv.scrollTop = atas;      // tetap di tempat; jangan melompat ke bawah
  }

  function batalkan(){
    const sedang = geserAktif;
    const atas = pv.scrollTop;
    lupakan();
    if (sedang){
      updatePreview();                // gambar ulang dari urutan yang tersimpan
      pv.scrollTop = atas;            // dan tetap di tempat yang sama
    }
  }

  pv.addEventListener("pointerdown", e => {
    if (mode !== MODE_CALC || geserAktif) return;
    const span = e.target.closest(".row");
    if (!span) return;
    // Kejadian "click" bawaan menyusul TEPAT sesudah pointerup, jadi kalau
    // sampai di sini benderanya masih menyala berarti klik itu tak pernah
    // datang (mis. jari diangkat di luar baris). Bersihkan, supaya ia tidak
    // menelan ketukan berikutnya yang sungguh-sungguh.
    baruSajaGeser = false;
    pointerId = e.pointerId;
    spanSeret = span;                 // harus tetap hidup selama digeser
    indexSeret = +span.dataset.i;
    kerja = curTape().slice();
    adaPerubahan = false;
    mulaiY = e.clientY;
    // sentuh: tahan dulu. Tetikus/pena: cukup ambang gerak (tak ada gulir jari).
    if (e.pointerType === "touch") timer = setTimeout(mulaiGeser, TAHAN_GESER);
  });

  pv.addEventListener("pointermove", e => {
    if (indexSeret === null || e.pointerId !== pointerId) return;
    if (!geserAktif){
      const dy = Math.abs(e.clientY - mulaiY);
      // sentuh yang bergerak sebelum tahanan penuh = pengguna sedang menggulir
      if (e.pointerType === "touch"){ if (dy > BATAL_GESER) lupakan(); return; }
      if (dy < AMBANG_GESER) return;
      mulaiGeser();
    }
    gulirTepi(e.clientY);
    for (let n = 0; n < 10 && satuLangkah(e.clientY); n++);
    e.preventDefault();
  });

  pv.addEventListener("pointerup", e => {
    if (e.pointerId === pointerId) jatuhkan();
  });
  pv.addEventListener("pointercancel", e => {
    if (e.pointerId === pointerId) batalkan();
  });
  // sentuh: cegah peramban ikut menggulir SELAMA memindah. touch-action tidak
  // dipasang di CSS karena pratinjau harus tetap bisa digulir saat tidak memindah.
  pv.addEventListener("touchmove", e => { if (geserAktif) e.preventDefault(); },
                      {passive: false});
  // Esc membatalkan; fase tangkap supaya mendahului juru-antar tombol kalkulator
  document.addEventListener("keydown", e => {
    if (!geserAktif || e.key !== "Escape") return;
    batalkan();
    setStat("Pemindahan dibatalkan.");
    e.preventDefault(); e.stopPropagation();
  }, true);
}

/* koma ribuan tanpa lewat Number: parseInt kehilangan presisi di atas ~15
   angka (12345678901234567 -> ...568). Versi Python memakai int() yang
   presisinya tak terbatas, jadi di sini pun angkanya jangan disentuh. */
function groupThousands(digits){
  return digits.replace(/^0+(?=\d)/, "").replace(/\B(?=(\d{3})+$)/g, ",");
}
function liveComma(){
  const el = $("inAmt");
  let raw = el.value.replace(/,/g,"");
  if (!raw || raw === "." || !/^\d*\.?\d*$/.test(raw)) return;
  const [ip, dec] = raw.split(".");
  let f = ip ? groupThousands(ip) : "";
  if (raw.includes(".")) f += "." + (dec || "");
  if (f !== el.value) el.value = f;
}
/* Mengembalikan true bila baris benar-benar tersimpan - dipakai keyPlus()
   untuk tahu apakah tekanan "+" berikutnya berarti TOTAL. */
function commit(op){
  let v = parseAmount($("inAmt").value);
  if (v === null){ if ($("inAmt").value.trim()) setStat("Angka tidak valid.","err"); return false; }
  if (ribu) v *= 1000;
  // Tanggal aktif -> wajib diisi lengkap (DDMM) sebelum baris bisa disimpan
  let raw = "";
  if (usedate){
    raw = $("inDate").dataset.raw || "";
    if (!isValidDate(raw)){
      // sudah 4 angka tapi tidak sah -> kosongkan supaya bisa langsung diketik ulang
      if (raw.length >= 4) setDate("");
      setStat("Tanggal wajib diisi: 4 angka DDMM, mis. 0907 = 9/7.","err");
      focusDate();
      return false;
    }
    setDate(raw);   // pastikan tersimpan sebagai "d/m"
  }
  const ev = ["e", v, op, usedate ? $("inDate").value.trim() : ""];
  // dicatat SEBELUM clearSel(), karena clearSel() sendiri memakai lastDate
  lastDate = raw;
  if (sel !== null){ curTape()[sel] = ev; clearSel(); setStat("Baris diperbarui.","ok"); }
  else { curTape().push(ev); setStat("Siap."); }
  // reset baris berikutnya: Nominal dikosongkan, Tanggal dibawa dari baris ini
  $("inAmt").value = ""; carryDate();
  if (usedate) focusDate(); else focusAmt();
  refreshCalcHead(); updatePreview(); saveAll();
  return true;
}
/* ---- "+" dua kali berturut-turut = TOTAL ----
   Dua tekanan "+" berurutan pada kolom NOMINAL berarti TOTAL. Tekanan pertama
   biasanya menyimpan baris (Nominal jadi kosong); tekanan kedua tidak ada lagi
   yang bisa disimpan, jadi diartikan TOTAL.

   Yang mempersenjatai pintasan adalah tekanan "+"-nya sendiri, BUKAN
   berhasil-tidaknya menyimpan baris. Kalau digantungkan pada penyimpanan
   baris, TOTAL tak bisa diulang: setelah TOTAL dihapus, tidak ada baris baru
   untuk disimpan sehingga pintasannya tak pernah aktif lagi.

   Tetap harus BERURUTAN: satu tekanan nyasar tidak berefek, karena keyTot()
   ikut mencetak bila Auto-cetak aktif. Tombol lain memutus rantainya, dan
   pintasan ini hanya berlaku saat kolom Nominal yang aktif - menekan "+" di
   numpad selagi kolom Tanggal aktif tidak akan meng-TOTAL. */
let plusArmed = false;
function keyPlus(){
  const diNominal = !(usedate && activeField === "date");
  if (diNominal && plusArmed && !$("inAmt").value.trim()){
    plusArmed = false;
    keyTot();
    return;
  }
  commit("+");
  plusArmed = diNominal;
}

  if (!count) return;
  curTape().push(["t"]);

  focusEntry();

/* Baru = buat pita baru (pita lama tersimpan sebagai riwayat, maks 6) */
function keyNew(silent){

    t.splice(last, 1);

/* ---- tempel (paste) di mode kalkulator: tiap baris angka jadi entri "+" ----
   parsePasteAmount() ada di core.js, dipakai bersama printapp.py */
function pasteRows(txt){
  const lines = txt.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  let n = 0, skip = 0;
  clearSel();
  for (const l of lines){
    const v = parsePasteAmount(l);
    if (v === null) skip++;
    else { curTape().push(["e", v, "+", ""]); n++; }
  }
  if (!n){ setStat("Tempelan tidak berisi angka yang bisa dibaca.","err"); return; }
  refreshCalcHead(); updatePreview(); saveAll();
  setStat(`${n} baris ditambahkan dari tempelan.` + (skip ? ` (${skip} baris dilewati)` : ""), "ok");
  focusEntry();
}
document.addEventListener("paste", e => {

  const txt = (e.clipboardData && e.clipboardData.getData("text")) || "";
  if (!txt.trim()) return;
  const multi = txt.trim().split(/\r?\n/).filter(l => l.trim()).length > 1;
  // satu baris di kolom input: biarkan tempel biasa; selain itu -> masukkan ke pita
  const el = document.activeElement;
  if (!multi && (el === $("inAmt") || el === $("inDate"))) return;
  e.preventDefault();
  pasteRows(txt);
});

/* ================= jembatan cetak PC (bridge.py) ================= */
/* Jika halaman disajikan bridge.py di PC, cetak lewat COM/antrean Windows;
   jika tidak (GitHub Pages / iPhone), pakai Bluetooth LE di bawah. */
let bridge = false;
async function initBridge(){
  let j;
  try {
    const r = await fetch("api/ping", {cache:"no-store"});
    if (!r.ok) return;
    j = await r.json();
    if (!j.ok) return;
  } catch(e){ return; }   // tak ada jembatan -> mode Bluetooth (iPhone)
  bridge = true;
  $("btnBT").style.display = "none";
  const sel = $("selPrinter");
  sel.style.display = "inline-block";   // CSS bawaannya display:none
  await loadPrinters(j.printer || "");
  sel.onchange = () => { writeStored(STORE.printer, sel.value); };
  setStat(sel.value ? `Siap - printer: ${sel.value}` : "Siap - pilih printer dulu.");
  autoClip();
}
async function loadPrinters(cfgSaved){
  try {
    const j = await (await fetch("api/printers", {cache:"no-store"})).json();
    const sel = $("selPrinter");
    sel.innerHTML = "";
    for (const p of j.printers || []){
      const o = document.createElement("option");
      o.value = o.textContent = p;
      sel.appendChild(o);
    }
    const want = [readText(STORE.printer), cfgSaved, j.default]
      .find(w => w && [...sel.options].some(o => o.value === w));
    if (want) sel.value = want;
  } catch(e){
    setStat("Gagal membaca daftar printer: " + e.message, "err");
  }
}
async function printBridge(draftText){
  const target = $("selPrinter").value;
  if (!target){ setStat("Pilih printer dulu.","err"); return; }
  const btn = $("btnPrint");
  btn.disabled = true; setStat("Mengirim...");
  try {
    const r = await fetch("api/print?target=" + encodeURIComponent(target),
                          {method:"POST", body: buildEscposPayload(draftText || currentDraft())});
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) throw new Error(j.error || ("HTTP " + r.status));
    setStat(`Terkirim ke "${target}" ✓`,"ok");
    saveAll();
  } catch(e){
    // fetch gagal total = jembatannya sudah tertutup, bukan printer bermasalah
    const msg = (e instanceof TypeError)
      ? 'jembatan cetak tertutup - jalankan "Cetak Draft Web.bat" lagi'
      : e.message;
    setStat("Gagal mencetak: " + msg, "err");
  } finally { btn.disabled = false; }
}
/* shortcut "Cetak dari Excel": halaman dibuka dengan ?autoclip=1 ->
   ambil isi clipboard dari jembatan, format, langsung cetak.
   Draf yang tersimpan TIDAK disentuh - clipboard diformat & dicetak langsung. */
async function autoClip(){
  if (!new URLSearchParams(location.search).has("autoclip")) return;
  history.replaceState(null, "", location.pathname);  // refresh tidak mencetak ulang
  try {
    const j = await (await fetch("api/clipboard")).json();
    if (!(j.text || "").trim()){
      setStat("Clipboard kosong - blok sel di Excel lalu Ctrl+C dulu.","err");
      return;
    }
    // sel Excel (ber-tab) SELALU dicetak sebagai kolom sejajar apa adanya,
    // tanpa nomor urut tambahan - apa pun mode aplikasi yang tersimpan
    const isTab = j.text.includes("\t");
    const draft = formatDraft(j.text, {...draftOptions(),
                                      showRowNumbers: isTab ? false : numbered,
                                      plainText: isTab || mode === MODE_PLAIN});
    $("preview").textContent = draft;   // perlihatkan apa yang dicetak
    await printBridge(draft);
  } catch(e){ setStat("Gagal membaca clipboard: " + e.message, "err"); }
}
/* ================= OCR: foto/gambar -> teks ================= */
/* Mesin OCR (Tesseract.js) dimuat dari internet saat PERTAMA dipakai;
   data bahasa (ind+eng, belasan MB) diunduh sekali lalu disimpan browser,
   jadi pemakaian berikutnya cepat. Hasil masuk ke kotak teks — dipakai
   di mode Tabel maupun Teks polos. */
let ocrWorker = null, ocrBusy = false;
function loadScript(src){
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = src;
    s.onload = res;
    s.onerror = () => rej(new Error("tidak bisa memuat mesin OCR - periksa internet"));
    document.head.appendChild(s);
  });
}
async function getOcrWorker(){
  if (ocrWorker) return ocrWorker;
  if (!window.Tesseract){
    setStat("Memuat mesin OCR...");
    await loadScript("https://cdn.jsdelivr.net/npm/tesseract.js@6/dist/tesseract.min.js");
  }
  setStat("Menyiapkan bahasa OCR (pertama kali agak lama)...");
  ocrWorker = await Tesseract.createWorker(["ind","eng"], 1, {
    logger: m => {
      if (m.status === "recognizing text")
        setStat("Membaca foto... " + Math.round(m.progress * 100) + "%");
    }
  });
  return ocrWorker;
}
/* rapikan hasil OCR: satu barang per baris, buang baris sampah tanpa huruf/angka */
function cleanOcrText(text){
  return text.split("\n")
    .map(l => l.replace(/\s+/g," ").trim())
    .filter(l => /[A-Za-z0-9]/.test(l))
    .join("\n");
}
async function runOcr(blob){
  if (ocrBusy || !blob) return;
  ocrBusy = true;
  $("btnOcr").disabled = true;
  try {
    const worker = await getOcrWorker();
    setStat("Membaca foto...");
    const {data} = await worker.recognize(blob);
    const text = cleanOcrText(data.text || "");
    if (!text){ setStat("Tidak ada teks terbaca di foto itu.","err"); return; }
    const el = $("txt");
    el.value = el.value.trim() ? el.value.replace(/\s+$/,"") + "\n" + text : text;
    updatePreview(); saveAll();
    setStat("OCR selesai - " + text.split("\n").length + " baris. Periksa hasilnya.","ok");
  } catch(e){
    ocrWorker = null;   // worker bisa rusak - buat baru pada percobaan berikutnya
    setStat("OCR gagal: " + ((e && e.message) || "periksa koneksi internet"), "err");
  } finally {
    ocrBusy = false;
    $("btnOcr").disabled = false;
  }
}
/* ================= Bluetooth LE (ESC/POS) ================= */
/* Daftar layanan BLE printer thermal yang umum - halaman hanya boleh
   mengakses layanan yang disebut di sini. */
/* Semua UUID ditulis lengkap sebagai string - jembatan Bluetooth Bluefy
   tidak bisa membaca kode angka pendek (0x18F0 dst.). */
const BLE_SERVICES = [
  "000018f0-0000-1000-8000-00805f9b34fb",  // ESC/POS-over-BLE standar (char 2AF1)
  "0000ae30-0000-1000-8000-00805f9b34fb",  // printer saku (char AE01)
  "0000ff00-0000-1000-8000-00805f9b34fb",
  "0000ff10-0000-1000-8000-00805f9b34fb",
  "0000ff12-0000-1000-8000-00805f9b34fb",
  "0000ffd0-0000-1000-8000-00805f9b34fb",
  "0000ffe0-0000-1000-8000-00805f9b34fb",
  "0000ffe5-0000-1000-8000-00805f9b34fb",
  "0000fff0-0000-1000-8000-00805f9b34fb",
  "0000abf0-0000-1000-8000-00805f9b34fb",
  "0000fee7-0000-1000-8000-00805f9b34fb",
  "49535343-fe7d-4ae5-8fa9-9fafd205e455",  // ISSC/Microchip UART (Rongta dkk.)
  "e7810a71-73ae-499d-8c15-faa9aef0c3f2",  // Zjiang/Goojprt dkk.
];
let bleDevice = null, bleChar = null;

/* Bluefy kadang gagal menyambung pada percobaan pertama; mencoba ulang
   beberapa kali jauh lebih andal daripada langsung menyerah. */
const BLE_CONNECT_ATTEMPTS = 3;
const BLE_RETRY_DELAY_MS = 900;
/* Printer thermal punya batas ukuran paket. 100 byte aman di kebanyakan
   perangkat; kalau gagal, dicoba lagi dengan potongan yang jauh lebih kecil. */
const BLE_CHUNK_BYTES = 100;
const BLE_SMALL_CHUNK_BYTES = 20;
const BLE_CHUNK_PAUSE_MS = 25;
const BLE_RETRY_PAUSE_MS = 300;

function blog(msg){
  const el = $("btlogtxt");
  el.textContent += msg + "\n";
}
function propsOf(c){
  const p = c.properties || {};
  const list = ["write","writeWithoutResponse","notify","read","indicate"]
    .filter(k => p[k]).join(",");
  return list || "?";
}
/* karakteristik "tulis" yang dikenal pada printer thermal (dicocokkan
   berdasarkan UUID kalau Bluefy tidak menyediakan .properties) */
const WRITE_CHARS = ["2af1","ffe1","ff02","ff03","ae01","abf1",
  "49535343-8841-43f4-a8d4-ecbe34729bb3",
  "bef8d6c9-9c21-4c9e-b632-bd58c1009f9f"];
function isKnownWrite(uuid){
  const u = uuid.toLowerCase();
  return WRITE_CHARS.some(w => u === w || u.startsWith("0000" + w + "-") || u.includes(w));
}
/* Minta pengguna memilih printer, sekali saja per sesi. */
async function pickPrinterDevice(){
  blog("--- " + new Date().toLocaleTimeString() + " ---");
  blog("Membuka daftar perangkat...");
  const device = await navigator.bluetooth.requestDevice({
    acceptAllDevices: true, optionalServices: BLE_SERVICES });
  blog("Dipilih: " + (device.name || "(tanpa nama)"));
  device.addEventListener("gattserverdisconnected", onPrinterDisconnected);
  return device;
}

function onPrinterDisconnected(){
  bleChar = null;
  $("btnBT").classList.remove("on");
  $("btnBT").innerHTML = "&#9679; Hubungkan";
  blog("Perangkat terputus.");
}

/* Sambungan GATT, dengan percobaan ulang. Melempar galat terakhir bila
   semuanya gagal. */
async function openGattServer(device){
  if (device.gatt.connected){
    blog("GATT sudah tersambung, dipakai ulang.");
    return device.gatt;
  }
  let lastError = null;
  for (let attempt = 1; attempt <= BLE_CONNECT_ATTEMPTS; attempt++){
    try {
      blog("Menghubungkan GATT (percobaan " + attempt + ")...");
      return await device.gatt.connect();
    } catch(error){
      lastError = error;
      blog("  gagal: " + error.name + " - " + error.message);
      // Bluefy kadang melempar "already registered/connected" padahal
      // sambungannya sudah aktif -> pakai saja yang ada.
      if (/already|registered|connected/i.test((error.name || "") + " " + (error.message || ""))){
        blog("  (dianggap sudah tersambung)");
        return device.gatt;
      }
      await sleep(BLE_RETRY_DELAY_MS);
    }
  }
  throw lastError;
}

/* Karakteristik yang dipakai menulis: yang JELAS bisa tulis lebih dulu, lalu
   yang UUID-nya dikenal, baru apa saja. .properties tak bisa dipercaya di
   Bluefy, jadi urutan itu yang menyelamatkan. */
async function findWriteCharacteristic(server){
  let services = [];
  try { services = await server.getPrimaryServices(); }
  catch(error){ blog("getPrimaryServices: " + error.name + " - " + error.message); }
  blog("Layanan terlihat: " + services.length);

  let writable = null, knownUuid = null, firstSeen = null;
  for (const service of services){
    blog("svc " + service.uuid);
    let characteristics = [];
    try { characteristics = await service.getCharacteristics(); }
    catch(error){ blog("  (karakteristik: " + error.message + ")"); continue; }
    for (const characteristic of characteristics){
      blog("  chr " + characteristic.uuid + " [" + propsOf(characteristic) + "]");
      const props = characteristic.properties || {};
      if ((props.writeWithoutResponse || props.write) && !writable) writable = characteristic;
      if (isKnownWrite(characteristic.uuid) && !knownUuid) knownUuid = characteristic;
      if (!firstSeen) firstSeen = characteristic;
    }
  }
  return writable || knownUuid || firstSeen;
}

function reportConnectFailure(error){
  if (error && error.name === "NotFoundError"){ setStat("Dibatalkan."); return; }
  blog("ERROR: " + (error ? error.name + " - " + error.message : "tidak diketahui"));
  setStat("Gagal terhubung (" + (error ? error.name : "?") + ") - buka LOG BLUETOOTH "
          + "di bawah dan kirimkan isinya.","err");
  $("btlog").open = true;
  bleDevice = null;              // mulai bersih pada percobaan berikutnya
}

async function connectBT(){
  if (!navigator.bluetooth){
    setStat("Bluetooth tidak tersedia. Buka halaman ini di aplikasi Bluefy.","err");
    return false;
  }
  bleChar = null;
  try {
    if (!bleDevice) bleDevice = await pickPrinterDevice();
    const server = await openGattServer(bleDevice);
    blog("GATT terhubung. Mencari layanan...");
    bleChar = await findWriteCharacteristic(server);
    if (!bleChar){
      blog("Tidak ditemukan jalur tulis.");
      setStat("Layanan printer tidak dikenali - buka LOG BLUETOOTH di bawah "
              + "dan kirimkan isinya.","err");
      $("btlog").open = true;
      return false;
    }
    blog("Dipakai: chr " + bleChar.uuid);
    $("btnBT").classList.add("on");
    $("btnBT").innerHTML = "&#9679; " + (bleDevice.name || "Terhubung");
    setStat("Printer terhubung.","ok");
    return true;
  } catch(error){
    reportConnectFailure(error);
    return false;
  }
}
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function writeOne(part){
  // .properties tak bisa dipercaya di Bluefy: coba tanpa-respons dulu,
  // lalu dengan-respons; ingat mana yang berhasil.
  if (bleWrite._m === "wor" || bleWrite._m == null){
    try { await bleChar.writeValueWithoutResponse(part); bleWrite._m = "wor"; return; }
    catch(e){ if (bleWrite._m === "wor") throw e; }
  }
  await bleChar.writeValue(part); bleWrite._m = "wr";
}
async function bleWrite(bytes){
  let chunkSize = BLE_CHUNK_BYTES;
  for (let attempt = 0; attempt < 2; attempt++){
    try {
      for (let start = 0; start < bytes.length; start += chunkSize){
        await writeOne(bytes.slice(start, start + chunkSize));
        await sleep(BLE_CHUNK_PAUSE_MS);
      }
      blog("Cetak terkirim (" + bytes.length + " byte).");
      return;
    } catch(error){
      blog("tulis gagal (potongan " + chunkSize + "): " + error.name + " - " + error.message);
      if (attempt > 0) throw error;
      // sekali lagi dengan potongan kecil, dan cara tulis dipilih ulang
      chunkSize = BLE_SMALL_CHUNK_BYTES;
      bleWrite._m = null;
      await sleep(BLE_RETRY_PAUSE_MS);
    }
  }
}

/* ---- umpan balik tombol numpad: getar, atau bunyi klik bila tak bisa getar ----
   iPhone/iPad TIDAK punya navigator.vibrate, begitu juga PC, jadi di situ yang
   terdengar adalah bunyi klik pendek. Android umumnya bisa getar.
   Catatan: di iPhone bunyi ikut sakelar senyap - kalau HP disenyapkan, klik
   tidak terdengar (tidak ada cara menghindarinya dari halaman web). */
let audioCtx = null;
function clickSound(){
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!audioCtx) audioCtx = new AC();
    if (audioCtx.state === "suspended") audioCtx.resume();
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
    osc.type = "square";
    osc.frequency.setValueAtTime(1700, t);
    // amplop sangat pendek -> terdengar seperti "tik", bukan nada
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.09, t + 0.002);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.03);
    osc.connect(g); g.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + 0.035);
  } catch(e){ /* audio diblokir/tak didukung: diamkan saja */ }
}
function canVibrate(){
  // hanya perangkat sentuh yang punya motor getar; di PC navigator.vibrate
  // kadang ada tapi tidak melakukan apa-apa, jadi jangan diandalkan di sana
  return isTouch() && typeof navigator.vibrate === "function";
}
function padFeedback(){
  if (!haptic) return;
  if (canVibrate() && navigator.vibrate(8)) return;
  clickSound();
}

  const k = b.dataset.k, el = $("inAmt");
  if (k !== "+") plusArmed = false;     // rantai "+ +" hanya untuk + berurutan
  const onDate = usedate && activeField === "date";
  if (k === "C") { if (onDate){ setDate(""); setDateCarried(false); } else el.value = ""; }
  else if (k === "BS") { if (onDate) backspaceDate(); else backspace(); }
  else if (k === "SUB") keySub();
  else if (k === "TOT") keyTot();
  else if (k === "CA") keyCA();
  else if (k === "+") keyPlus();       // dua kali berturut-turut = TOTAL
  else if (k === "-") commit("-");
  else if (k === ".") { if (!onDate && !el.value.includes(".")) el.value += "."; }
  else if (onDate) { for (const d of k) padDateDigit(d); }   // "00"/"000" -> per angka
  else { el.value += k; liveComma(); }
});
/* ---- aturan tombol untuk kolom Nominal (dipanggil hanya dari juru-antar) ---- */
function amtKey(e){
  const el = $("inAmt"), k = e.key;
  // Enter = "+" di papan ketik fisik, jadi ikut rantai "+ +" -> TOTAL.
  // Tombol lain memutus rantainya.
  if (!((k === "Enter" && !e.shiftKey) || k === "+")) plusArmed = false;
  // Shift+Enter: lompat dari Nominal kembali ke Tanggal
  if (k === "Enter" && e.shiftKey){ if (usedate) focusDate(); e.preventDefault(); return; }
  // panah kiri di ujung kiri Nominal -> pindah ke Tanggal ("di ujung")
  if (k === "ArrowLeft"){
    if (usedate && el.selectionStart === 0 && el.selectionEnd === 0){ focusDate(); e.preventDefault(); }
    return;   // selain di ujung: biarkan caret bergerak normal
  }
  if (k === "ArrowRight") return;  // caret normal
  if (k === "ArrowUp"){ selectPrev(); e.preventDefault(); return; }    // pilih baris sebelumnya
  if (k === "ArrowDown"){ selectNext(); e.preventDefault(); return; }  // pilih baris berikutnya
  if (/^[0-9]$/.test(k)){ el.value += k; liveComma(); e.preventDefault(); }
  else if (k === "."){ if (!el.value.includes(".")) el.value += "."; e.preventDefault(); }
  else if (k === "Enter" || k === "+"){ keyPlus(); e.preventDefault(); }   // 2x = TOTAL
  else if (k === "-"){ commit("-"); e.preventDefault(); }
  else if (k === "Backspace"){ backspace(); e.preventDefault(); }      // mundur ke kiri
  else if (k === "Delete"){ deleteFromAmt(); e.preventDefault(); }     // langsung hapus baris
  else if (k === "Escape"){
    if (sel !== null){ clearSel(); updatePreview(); setStat("Edit dibatalkan."); }
    else { el.value = ""; lastDate = ""; setDate(""); }
    e.preventDefault();
  }
}
/* ---- SATU juru-antar tombol untuk mode kalkulator ----
   Tujuan tombol ditentukan HANYA oleh activeField (kolom mana yang sedang
   dipakai), persis seperti tombol numpad. Sengaja TIDAK memakai
   document.activeElement untuk memilih kolom: sebagian penangan memindahkan
   fokus di tengah jalan (angka ke-4 tanggal, Enter, panah kanan), jadi
   elemen yang fokus saat tombol ditekan bisa berbeda dengan saat diperiksa —
   dulu itu membuat angka ke-4 tanggal ikut masuk ke Nominal.
   Karena hanya ada satu penangan, tidak ada lagi urusan urutan/propagasi. */
document.addEventListener("keydown", e => {
  // modal pengaturan terbuka: Esc menutup, tombol lain tidak masuk kalkulator
  if (setOpen){
    if (e.key === "Escape"){ closeSettings(); e.preventDefault(); }
    return;
  }
  if (mode !== MODE_CALC) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;   // mis. Ctrl+P: biarkan lewat
  const amt = $("inAmt"), dte = $("inDate"), ae = document.activeElement;
  // kontrol lain (pilihan printer, kotak teks, dsb.) mengetik untuk dirinya sendiri
  if (ae && ae !== amt && ae !== dte &&
      /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) return;
  if (usedate && activeField === "date"){
    if (ae !== dte) focusDate();          // mis. habis mengetuk baris pita
    dateKey(e);
  } else {
    if (ae !== amt) focusAmt();
    amtKey(e);
  }
});
/* ---- kolom Tanggal: saat difokus tampil angka mentah (DDMM), saat ditinggalkan
   tampil "d/m"; Enter / panah-kanan-di-ujung lompat ke Nominal ---- */
$("inAmt").addEventListener("focus", () => { activeField = "amt"; });
$("inDate").addEventListener("focus", () => { activeField = "date"; const el=$("inDate"); el.value = el.dataset.raw || ""; moveCaretEnd(el); });
$("inDate").addEventListener("blur", () => setDate($("inDate").dataset.raw));
$("inDate").addEventListener("input", () => {
  const el=$("inDate"); el.dataset.raw = el.value.replace(/\D/g,"").slice(0,4); el.value = el.dataset.raw;
  setDateCarried(false);   // disunting sendiri (tempel/ketik bawaan), bukan bawaan
});
/* satu tempat aturan tombol kolom Tanggal: dipakai kolomnya sendiri, dan
   dipakai ulang oleh keydown dokumen saat tak ada kolom yang difokus */
function dateKey(e){
  const el = $("inDate"), k = e.key;
  /* Enter di sini hanya MENYETUJUI tanggal & pindah ke Nominal - bukan masukan
     baru - jadi rantai "+ +" dibiarkan hidup: Enter (simpan) → Enter (lewati
     tanggal) → Enter (TOTAL). Tombol lain memutusnya. */
  if (!(k === "Enter" && !e.shiftKey)) plusArmed = false;
  /* angka selalu lewat padDateDigit, sama seperti tombol numpad. Kolom ini
     dibuat read-only di layar sentuh supaya papan ketik HP/tablet tak muncul —
     ketikan bawaan tidak akan masuk, jadi angkanya harus dimasukkan sendiri.
     Kolom Nominal memang sudah bekerja begini di semua ukuran. */
  if (/^[0-9]$/.test(k)){ padDateDigit(k); e.preventDefault(); return; }
  if (k === "Enter" && !e.shiftKey){                        // Tanggal -> Nominal
    // Enter = menyetujui tanggal (termasuk yang terbawa) -> tulisan normal lagi
    setDate(el.dataset.raw); setDateCarried(false); focusAmt(); e.preventDefault();
  } else if (k === "ArrowRight"){                            // di ujung kanan -> Nominal
    if (el.selectionStart >= el.value.length){
      setDate(el.dataset.raw); setDateCarried(false);
      focusAmt(); moveCaretStart($("inAmt")); e.preventDefault();
    }
  } else if (k === "ArrowUp"){ selectPrev(); e.preventDefault(); }   // pilih baris sebelumnya
  else if (k === "ArrowDown"){ selectNext(); e.preventDefault(); }   // pilih baris berikutnya
  else if (k === "Backspace" || k === "Delete"){
    // kolom kosong -> hapus baris pita (mis. baris TOTAL), sama seperti di Nominal
    backspaceDate(); e.preventDefault();
  } else if (k === "Escape"){
    if (sel !== null){ clearSel(); updatePreview(); setStat("Edit dibatalkan."); }
    else { $("inAmt").value = ""; lastDate = ""; setDate(""); }
    e.preventDefault();
  }
  // ArrowLeft di ujung kiri: kolom paling kiri, biarkan caret bergerak normal
}
$("togDate").onclick = () => {
  usedate = !usedate; saveAll(); applyUsedate();
  if (mode === MODE_CALC){
    if (usedate){ setDate(""); focusDate(); } else $("inAmt").focus();
    setStat(usedate ? "Kolom tanggal aktif (d/m). Enter: ke Nominal, Shift+Enter: kembali."
                    : "Kolom tanggal mati.");
  }
};
$("togRibu").onclick = () => {
  ribu = !ribu; saveAll(); refreshToggles();
  // sedang mengedit baris: sesuaikan tampilan Nominal dengan mode baru
  if (sel !== null) $("inAmt").value = amtToInput(curTape()[sel][1]);
  if (mode === MODE_CALC){
    focusAmt();
    setStat(ribu ? "×1000 aktif: angka yang diketik dikalikan 1000." : "×1000 mati.");
  }
};
/* init */
applyTheme();
initGrip(); initColGrip(); initRowDrag();
applyUsedate(); refreshToggles(); applyMode();
// peringatan dipasang SESUDAH initBridge selesai: ia menulis status sendiri
// secara asinkron dan akan menimpa pesan ini kalau dipasang lebih dulu
initBridge().finally(() => {
  if (tapesRusak)
    setStat("Riwayat pita tersimpan rusak - dimulai dari pita kosong.", "err");
});
</script>
</body>
